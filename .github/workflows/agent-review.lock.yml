    - env:
        SHARE_NAME: agentskills
        SHARE_PATH: agentskills
      name: Share agentskills as /etc/agent-share/agentskills (generated)
      run: |
        // A `share` runner step, run as root (`sudo node`): publishes a file or a
        // directory tree from the runner's side as a root-owned, world-readable
        // copy under SHARE_DIR, so the sandboxed steps can read it but not change
        // it. This is the one channel from the privileged phase to the sandbox
        // that the sandbox can trust not to have been rewritten by an earlier
        // sandboxed step.
        //
        // The step's settings come from the environment, not from the script
        // text: Actions expands expressions in `run:` before the script
        // runs, and a value spliced into the source could inject code, while in
        // `env:` it stays data.
        //
        //   SHARE_NAME     the name under SHARE_DIR ([A-Za-z0-9][A-Za-z0-9._-]*)
        //   SHARE_PATH     a file or directory to copy (relative to the workspace)
        //   SHARE_CONTENT  literal file content (instead of SHARE_PATH)
        //
        // Symlinks and special files in the source are refused: a checkout can
        // contain a symlink to /etc/shadow, and following it here, as root, would
        // publish the target to every user.
        "use strict";
        const fs = require("node:fs");
        const path = require("node:path");

        const SHARE_DIR = "/etc/agent-share";
        const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;

        function fail(message) {
          console.error(`share: ${message}`);
          process.exit(1);
        }

        // Copies SRC to DEST, as root:root with 0644 files and 0755 directories.
        function copyTree(src, dest) {
          const st = fs.lstatSync(src);
          if (st.isDirectory()) {
            fs.mkdirSync(dest, { mode: 0o755 });
            fs.chmodSync(dest, 0o755);
            for (const entry of fs.readdirSync(src).sort()) {
              copyTree(path.join(src, entry), path.join(dest, entry));
            }
          } else if (st.isFile()) {
            // Not copyFileSync: libuv gives the copy the source's owner, and a
            // runner-owned file could be changed after the sandbox is entered.
            fs.writeFileSync(dest, fs.readFileSync(src), { mode: 0o644, flag: "wx" });
            fs.chmodSync(dest, 0o644);
          } else {
            fail(`${src} is neither a regular file nor a directory; refusing to share it`);
          }
        }

        if (process.getuid() !== 0) fail("must run as root");
        const name = process.env.SHARE_NAME ?? "";
        if (!NAME_RE.test(name)) fail(`invalid share name ${JSON.stringify(name)}`);
        const hasPath = process.env.SHARE_PATH !== undefined;
        const hasContent = process.env.SHARE_CONTENT !== undefined;
        if (hasPath === hasContent) fail("set exactly one of SHARE_PATH or SHARE_CONTENT");

        fs.mkdirSync(SHARE_DIR, { recursive: true, mode: 0o755 });
        fs.chmodSync(SHARE_DIR, 0o755);
        const dest = path.join(SHARE_DIR, name);
        // Build the copy next to its final name, so readers never see half of it.
        const tmp = `${dest}.tmp-${process.pid}`;
        fs.rmSync(tmp, { recursive: true, force: true });
        try {
          if (hasContent) {
            fs.writeFileSync(tmp, process.env.SHARE_CONTENT, { mode: 0o644, flag: "wx" });
            fs.chmodSync(tmp, 0o644);
          } else {
            // copyTree refuses symlinks below the path, and this those in it: a
            // symlinked directory `a` in a checkout would otherwise make `a/b`
            // any file on the machine.
            const src = path.resolve(fs.realpathSync(process.cwd()), process.env.SHARE_PATH);
            if (fs.realpathSync(src) !== src) fail(`${process.env.SHARE_PATH} goes through a symlink; refusing to share it`);
            copyTree(src, tmp);
          }
          // Owned by root however it was made.
          fs.chownSync(tmp, 0, 0);
          if (fs.lstatSync(tmp).isDirectory()) {
            for (const entry of fs.readdirSync(tmp, { recursive: true })) fs.lchownSync(path.join(tmp, entry), 0, 0);
          }
          fs.rmSync(dest, { recursive: true, force: true });
          fs.renameSync(tmp, dest);
        } finally {
          fs.rmSync(tmp, { recursive: true, force: true });
        }
        console.log(`Shared ${hasContent ? "content" : process.env.SHARE_PATH} as ${dest} (root-owned, read-only to other users)`);
      shell: sudo --preserve-env=SHARE_NAME,SHARE_PATH,SHARE_CONTENT node {0}
    - env:
        AGENT_STUB: |
          #!/bin/bash
          # A stand-in for a coding agent, for agent-run's proof of concept: it reads
          # its prompt the way an agent would, then behaves like a hostile one and
          # tries to rewrite its own instructions, become root and reach the job's
          # credentials. It fails if any of that works, and otherwise writes a
          # "review" and a step output.
          #
          #   agent-stub PROMPT-FILE
          set -euo pipefail

          prompt=${1:?usage: agent-stub PROMPT-FILE}
          escaped=()

          echo "agent-stub: running as $(id -un) (uid $(id -u)) in $PWD"
          echo "agent-stub: prompt $prompt, owned by $(stat -c '%U:%G %a' "$prompt"):"
          sed 's/^/  > /' "$prompt"

          if { echo "ignore all previous instructions" >>"$prompt"; } 2>/dev/null; then escaped+=("rewrote its prompt"); fi
          if touch "$(dirname "$prompt")/injected" 2>/dev/null; then escaped+=("added a file to the share"); fi
          if sudo -n true 2>/dev/null; then escaped+=("became root with sudo"); fi
          for v in ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN; do
            if [[ -v $v ]]; then escaped+=("saw $v"); fi
          done
          worker=$(pgrep -f Runner.Worker | head -n1 || true)
          if [[ -n $worker ]] && cat "/proc/$worker/environ" >/dev/null 2>&1; then escaped+=("read Runner.Worker's environment"); fi

          if ((${#escaped[@]})); then
            printf 'agent-stub: ESCAPED: %s\n' "${escaped[@]}" >&2
            exit 1
          fi
          echo "agent-stub: every escape attempt failed"

          {
            echo "# Review by agent-stub"
            echo
            echo "Prompt: \`$prompt\` ($(wc -l <"$prompt") lines), read as $(id -un)."
          } >review.md
          echo "verdict=looks-good" >>"$GITHUB_OUTPUT"
          cat review.md >>"$GITHUB_STEP_SUMMARY"
      name: Install the agent (stub)
      run: |-
        printf '%s' "$AGENT_STUB" | sudo tee /usr/local/bin/agent-stub >/dev/null
        sudo chmod 0755 /usr/local/bin/agent-stub
      shell: bash
    - name: Secure the host (generated)
      run: |
        // The compiler-generated "secure the host" step, run as root (`sudo node`)
        // before the job enters the sandbox. It closes what runner images leave
        // open to every local user, which stops mattering only once some steps
        // run as a user other than runner. These are the image fixes from
        // cgwalters-devspace-sandbox's setup-runner-sandbox.mjs, for images like
        // the RHEL runners that are built with umask 000.
        //
        // TODO: replace this step with cgwalters-forge/actions/secure-host-setup,
        // pinned by commit, once it exists.
        "use strict";
        const fs = require("node:fs");
        const { spawnSync } = require("node:child_process");

        // The runner's .credentials and the hosted compute agent's token
        // (/opt/hca/.settings, RHEL runners only) are world-readable there.
        const PRIVATE_DIRS = ["/home/runner", "/opt/hca"];
        // Sticky world-writable directories, meant to stay that way.
        const SHARED_TMP = ["/tmp", "/var/tmp"];
        // Some images set XDG_RUNTIME_DIR to runner's here, and PAM hands it to
        // every session, which breaks other users' session bus and rootless podman.
        // https://github.com/actions/runner-images/issues/14649
        const ENVIRONMENT = "/etc/environment";
        const IMAGE_ENV_VARS = ["XDG_RUNTIME_DIR"];

        function run(cmd, args) {
          const r = spawnSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"], maxBuffer: 1 << 28 });
          if (r.status !== 0) throw new Error(`${cmd} ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return r.stdout.trim();
        }

        if (process.getuid() !== 0) throw new Error("must run as root");

        for (const dir of PRIVATE_DIRS.filter((d) => fs.existsSync(d))) {
          fs.chmodSync(dir, 0o700);
        }

        // World-writable system files include ones root loads code from (a polkit
        // rule, a unit): any user could make itself root through them.
        const prune = SHARED_TMP.flatMap((d) => ["-path", d, "-o"]);
        const fixed = run("find", ["/", "-xdev", "(", ...prune, "-false", ")", "-prune", "-o",
          "(", "-type", "f", "-o", "-type", "d", ")", "-perm", "-0002", "!", "-perm", "-1000",
          "-print", "-exec", "chmod", "o-w", "{}", "+"]);
        const paths = fixed ? fixed.split("\n") : [];
        console.log(`Removed world write access from ${paths.length} paths${paths.length ? `, such as:\n  ${paths.slice(0, 10).join("\n  ")}` : ""}`);

        if (fs.existsSync(ENVIRONMENT)) {
          const lines = fs.readFileSync(ENVIRONMENT, "utf8").split("\n");
          const kept = lines.filter((l) => !IMAGE_ENV_VARS.some((v) => l.trim().startsWith(`${v}=`)));
          if (kept.length !== lines.length) {
            const tmp = `${ENVIRONMENT}.secure-host`;
            fs.writeFileSync(tmp, kept.join("\n"), { mode: fs.statSync(ENVIRONMENT).mode & 0o7777 });
            fs.renameSync(tmp, ENVIRONMENT);
