    - env:
        RUNNER_SANDBOX_EXEC_JS: |
          // Runner side of a sandboxed step, used as its shell
          // (`shell: /usr/local/bin/runner-sandbox-exec {0}`). It runs as the runner
          // user, which holds the job's credentials, so it passes along only the step
          // script, the variables the compiler listed in RUNNER_SANDBOX_ENV and a
          // fixed set of non-secret context variables, and asks runner-sandbox-run
          // (through sudo) to run the script as the sandbox user. Afterwards it copies
          // the step's outputs and summary into the runner's own files, accepting only
          // plain name=value output lines.
          //
          // `runner-sandbox-exec --collect NAME PATH` has the root side copy PATH
          // out of the sandbox for a generated upload step instead.
          "use strict";
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { spawnSync } = require("node:child_process");

          const RUN = "/usr/local/libexec/runner-sandbox-run";
          const SUDO = "/usr/bin/sudo";
          const RESULTS_DIR = "/run/runner-sandbox/results";
          const CONTEXT_ENV = [
            "CI", "GITHUB_ACTIONS", "GITHUB_ACTOR", "GITHUB_EVENT_NAME", "GITHUB_JOB", "GITHUB_REF", "GITHUB_REF_NAME",
            "GITHUB_REPOSITORY", "GITHUB_RUN_ATTEMPT", "GITHUB_RUN_ID", "GITHUB_SERVER_URL", "GITHUB_SHA", "GITHUB_WORKFLOW",
          ];
          const OUTPUT_LINE = /^[A-Za-z_][A-Za-z0-9_-]*=[^\r]*$/;

          function fail(message) {
            console.error(`runner-sandbox-exec: ${message}`);
            process.exit(125);
          }

          const collect = process.argv[2] === "--collect";
          const scriptPath = process.argv[2];
          if (collect ? process.argv.length !== 5 : !scriptPath || process.argv.length !== 3) {
            fail("usage: runner-sandbox-exec SCRIPT | --collect NAME PATH");
          }
          const names = (process.env.RUNNER_SANDBOX_ENV ?? "").split(",").filter(Boolean);
          const env = {};
          for (const name of [...CONTEXT_ENV, ...names]) {
            if (process.env[name] !== undefined) env[name] = process.env[name];
          }
          const id = crypto.randomBytes(16).toString("hex");
          const request = JSON.stringify(collect
            ? { id, collect: { name: process.argv[3], path: process.argv[4] } }
            : { id, script: fs.readFileSync(scriptPath, "utf8"), env });
          // By absolute path: the step's own env: applies to this process.
          const r = spawnSync(SUDO, ["-n", RUN], { input: request, stdio: ["pipe", "inherit", "inherit"] });
          if (r.error) fail(`running ${RUN}: ${r.error.message}`);

          let result;
          try {
            result = JSON.parse(fs.readFileSync(`${RESULTS_DIR}/${id}.json`, "utf8"));
          } catch (e) {
            fail(`no result from the sandbox (exit ${r.status}): ${e.message}`);
          }
          if (result.error) fail(result.error);
          const lines = result.output.split("\n").filter((l) => l !== "");
          const bad = lines.find((l) => !OUTPUT_LINE.test(l));
          if (bad !== undefined) fail(`refusing GITHUB_OUTPUT line ${JSON.stringify(bad.slice(0, 80))}: only name=value lines are accepted`);
          if (lines.length) fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          if (result.summary) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, result.summary);
          process.exit(result.status);
        RUNNER_SANDBOX_HANDOFF_JS: |
          // The workspace hand-off: what the enter step copies from the runner's
          // workspace into the sandbox's. install.cjs loads it (the compiler passes
          // it as RUNNER_SANDBOX_HANDOFF_JS) and runs it as root; tests/runtime/
          // requires it directly.
          //
          // The job's `handoff.workspace` picks what is copied:
          //
          //   tracked  the files git tracks (`git ls-files`), plus handoff.include
          //   all      the whole workspace
          //   none     nothing: the sandbox starts in an empty directory
          //
          // Nothing here follows a symlink: a path that goes through one is refused,
          // and a symlink inside the copied tree is copied as a symlink, which the
          // sandbox then resolves as its own user. Special files are refused. The
          // copy is refused too if it holds credentials a setup step left behind,
          // such as checkout's token with persist-credentials, or an .npmrc token.
          // Files exactly as git tracks them aren't scanned: whatever they hold was
          // committed, not left behind by the runner.
          "use strict";
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const HANDOFF_MODES = ["tracked", "all", "none"];

          // Files that hold credentials: which paths, and patterns whose first group
          // is the credential. A value that only refers to an environment variable
          // (an .npmrc's `_authToken=${NPM_TOKEN}`) is not one.
          const CREDENTIAL_FILES = [
            // checkout's persist-credentials (older versions write it here), or a
            // token in a remote URL, for the repository and its submodules.
            { path: /(^|\/)\.git\/(modules\/.+\/)?config$/, re: [/^\s*extraheader\s*=\s*(.+)$/gim, /:\/\/[^/\s:@]+:([^/\s@]+)@/g] },
            { path: /(^|\/)\.git-credentials$/, re: [/^\s*(\S.*?)\s*$/gm] },
            { path: /(^|\/)\.netrc$/, re: [/\bpassword\s+(\S+)/g] },
            { path: /(^|\/)\.npmrc$/, re: [/(?:_authToken|_auth|_password)\s*=\s*(.+)$/gm] },
            { path: /(^|\/)\.yarnrc\.yml$/, re: [/(?:npmAuthToken|npmAuthIdent)\s*:\s*(.+)$/gm] },
            { path: /(^|\/)\.pypirc$/, re: [/^\s*password\s*[=:]\s*(.+)$/gm] },
            { path: /(^|\/)\.docker\/config\.json$/, re: [/"(?:auth|identitytoken|registrytoken)"\s*:\s*"([^"]+)"/g] },
            { path: /(^|\/)\.aws\/credentials$/, re: [/aws_secret_access_key\s*=\s*(.+)$/gm] },
            // gh's login, cargo's registry token.
            { path: /(^|\/)gh\/hosts\.yml$/, re: [/oauth_token\s*:\s*(.+)$/gm] },
            { path: /(^|\/)\.cargo\/credentials(\.toml)?$/, re: [/^\s*token\s*=\s*(.+)$/gm] },
            // google-github-actions/auth writes these into the workspace.
            { path: /(^|\/)gha-creds-[^/]*\.json$/, re: [/^([\s\S]+)$/g] },
          ];
          // Tokens GitHub issues, in any file.
          const GITHUB_TOKEN_RE = /\b(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})\b/;
          const ENV_REFERENCE_RE = /^\s*["']?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?["']?\s*$/;

          // Throws if DATA, the content of the workspace file REL, holds credentials.
          function checkCredentials(data, rel) {
            const text = data.toString("utf8");
            const refuse = (what) => {
              throw new Error(`${rel} holds ${what}; refusing to hand it to the sandbox (for checkout, set persist-credentials: false)`);
            };
            if (GITHUB_TOKEN_RE.test(text)) refuse("a GitHub token");
            for (const c of CREDENTIAL_FILES) {
              if (!c.path.test(rel)) continue;
              for (const re of c.re) {
                for (const m of text.matchAll(re)) {
                  if (!ENV_REFERENCE_RE.test(m[1])) refuse("credentials");
                }
              }
            }
          }

          // The git object id of DATA as a blob, in the hash of OID (SHA-1 or SHA-256).
          function blobId(data, oid) {
            const hash = crypto.createHash(oid.length === 64 ? "sha256" : "sha1");
            return hash.update(`blob ${data.length}\0`).update(data).digest("hex");
          }

          // {path: oid} from the NUL-separated output of `git ls-files -z -s`.
          function parseIndex(text) {
            const index = new Map();
            for (const entry of text.split("\0").filter(Boolean)) {
              const m = /^\d+ ([0-9a-f]{40}|[0-9a-f]{64}) \d+\t(.+)$/s.exec(entry);
              if (!m) throw new Error(`unexpected git ls-files entry ${JSON.stringify(entry.slice(0, 80))}`);
              index.set(m[2], m[1]);
            }
            return index;
          }

          // A relative path within the workspace: no leading /, no . or .. component.
          function checkRelative(rel) {
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === "" || c === "." || c === "..")) {
              throw new Error(`invalid workspace path ${JSON.stringify(rel)}`);
            }
          }

          // Whether ROOT/REL exists; throws if it goes through a symlink before its
          // last component.
          function existsNoSymlinkAbove(root, rel) {
            let p = root;
            for (const part of rel.split("/")) {
              p = path.join(p, part);
              const st = fs.lstatSync(p, { throwIfNoEntry: false });
              if (!st) return false;
              if (p === path.join(root, rel)) return true;
              if (st.isSymbolicLink()) throw new Error(`${rel} goes through the symlink ${path.relative(root, p)}`);
              if (!st.isDirectory()) throw new Error(`${rel}: ${path.relative(root, p)} is not a directory`);
            }
            return true;
          }

          // Copies SRC (REL in the workspace) to DEST, owned by OWNER {uid, gid},
          // keeping modes and times, copying symlinks as symlinks, refusing special
          // files and credentials in files that differ from INDEX.
          function copyEntry(src, dest, rel, owner, index) {
            const st = fs.lstatSync(src);
            if (st.isSymbolicLink()) {
              fs.symlinkSync(fs.readlinkSync(src), dest);
              fs.lchownSync(dest, owner.uid, owner.gid);
              return;
            }
            if (st.isDirectory()) {
              fs.mkdirSync(dest, { mode: 0o700 });
              for (const entry of fs.readdirSync(src).sort()) {
                copyEntry(path.join(src, entry), path.join(dest, entry), path.join(rel, entry), owner, index);
              }
            } else if (st.isFile()) {
              const data = fs.readFileSync(src);
              const oid = index.get(rel);
              if (!oid || blobId(data, oid) !== oid) checkCredentials(data, rel);
              fs.writeFileSync(dest, data, { mode: 0o600, flag: "wx" });
            } else {
              throw new Error(`${rel} is not a regular file, directory or symlink; refusing to hand it to the sandbox`);
            }
            fs.chownSync(dest, owner.uid, owner.gid);
            fs.chmodSync(dest, st.mode & 0o7777 & ~0o6000);
            fs.utimesSync(dest, st.atime, st.mtime);
          }

          // Creates the parent directories of DEST_ROOT/REL that don't exist yet,
          // like their counterparts in SRC_ROOT.
          function makeParents(srcRoot, destRoot, rel, owner) {
            const parts = rel.split("/").slice(0, -1);
            for (let i = 1; i <= parts.length; i++) {
              const sub = parts.slice(0, i).join("/");
              const dest = path.join(destRoot, sub);
              if (fs.existsSync(dest)) continue;
              const st = fs.lstatSync(path.join(srcRoot, sub));
              fs.mkdirSync(dest, { mode: st.mode & 0o777 });
              fs.chownSync(dest, owner.uid, owner.gid);
            }
          }

          // The workspace paths to copy for MODE, relative to the workspace, or null
          // for all of it, given the INDEX of what git tracks.
          function handoffPaths(mode, include, index) {
            if (!HANDOFF_MODES.includes(mode)) throw new Error(`invalid handoff mode ${JSON.stringify(mode)}`);
            if (mode === "none") return [];
            if (mode === "all") return null;
            const all = new Set([...index.keys(), ...include]);
            // A path below another one in the list is copied with it (an included
            // directory, or a submodule, which git lists as one entry).
            const below = (p) => {
              const parts = p.split("/");
              return parts.slice(1).some((_, i) => all.has(parts.slice(0, i + 1).join("/")));
            };
            return [...all].filter((p) => !below(p)).sort();
          }

          // Hands WORKSPACE over to DEST, owned by OWNER. LIST_TRACKED returns the
          // output of `git ls-files -z -s` (install.cjs runs it as the runner user,
          // not root), and throws if the workspace isn't a git checkout, which only
          // 'tracked needs. Returns the number of top-level entries copied.
          function handoff({ workspace, dest, mode, include = [], owner, listTracked }) {
            for (const rel of include) checkRelative(rel);
            let index = new Map();
            if (mode !== "none") {
              try {
                index = parseIndex(listTracked());
              } catch (e) {
                if (mode === "tracked") throw e;
              }
            }
            const paths = handoffPaths(mode, include, index);
            fs.mkdirSync(dest, { recursive: true, mode: 0o755 });
            fs.chownSync(dest, owner.uid, owner.gid);
            const rels = paths ?? fs.readdirSync(workspace).sort();
            for (const rel of rels) {
              checkRelative(rel);
              const src = path.join(workspace, rel);
              if (!existsNoSymlinkAbove(workspace, rel)) {
                // A tracked file the setup steps deleted is simply not there.
                if (include.includes(rel)) throw new Error(`handoff.include path ${rel} does not exist in the workspace`);
                continue;
              }
              makeParents(workspace, dest, rel, owner);
              copyEntry(src, path.join(dest, rel), rel, owner, index);
            }
            return rels.length;
          }

          module.exports = { handoff, handoffPaths, checkCredentials, HANDOFF_MODES };
        RUNNER_SANDBOX_RUN_JS: |
          // Root side of a sandboxed step: runner-sandbox-exec pipes a request
          // ({id, script, env}) to this program through `sudo -n`, the one command the
          // runner user may still run as root once the job has entered the sandbox.
          // It runs the script as the sandbox user with run0, in a login session of
          // its own and with a fixed environment, then hands back what the step wrote to its
          // GITHUB_OUTPUT and GITHUB_STEP_SUMMARY. Nothing here trusts the request: its
          // fields are validated, and the files the sandbox wrote are read without
          // following symlinks.
          //
          // A request {id, collect: {name, path}} instead copies PATH from the
          // sandbox's workspace to COLLECT_DIR/NAME, for a generated upload step:
          // actions like upload-artifact run as runner and follow symlinks, so they
          // must never read a path the sandbox controls.
          "use strict";
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const CONFIG = JSON.parse(fs.readFileSync("/etc/runner-sandbox/config.json", "utf8"));
          const STEPS_DIR = "/run/runner-sandbox/steps";
          const RESULTS_DIR = "/run/runner-sandbox/results";
          const COLLECT_DIR = "/run/runner-sandbox/collect";
          const MAX_FILE = 1 << 20;
          const SANDBOX_PATH = "/usr/local/bin:/usr/bin:/bin";
          const SUDO_VARS = ["SUDO_USER", "SUDO_UID", "SUDO_GID", "SUDO_HOME"];
          // Variables the request may not set: the runner's credentials and anything
          // that changes how the sandbox's own programs start.
          const DENIED_ENV = /^(ACTIONS_|GITHUB_TOKEN$|GITHUB_ENV$|GITHUB_PATH$|GITHUB_OUTPUT$|GITHUB_STATE$|GITHUB_STEP_SUMMARY$|RUNNER_|LD_|BASH_ENV$|ENV$|NODE_|PATH$|HOME$|USER$|LOGNAME$|SHELL$)/;

          function fail(message) {
            console.error(`runner-sandbox-run: ${message}`);
            process.exit(125);
          }

          // Reads a file the sandbox user wrote, refusing symlinks and oversized files.
          function readSandboxFile(file) {
            let fd;
            try {
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
            } catch (e) {
              if (e.code === "ENOENT") return "";
              throw new Error(`${path.basename(file)}: ${e.code}`);
            }
            try {
              const st = fs.fstatSync(fd);
              if (!st.isFile()) throw new Error(`${path.basename(file)} is not a regular file`);
              if (st.size > MAX_FILE) throw new Error(`${path.basename(file)} is larger than ${MAX_FILE} bytes`);
              return fs.readFileSync(fd, "utf8");
            } finally {
              fs.closeSync(fd);
            }
          }

          // Copies SRC to DEST as root:root, 0644 files in 0755 directories,
          // refusing symlinks and special files anywhere below SRC.
          function copyTree(src, dest) {
            const st = fs.lstatSync(src);
            if (st.isDirectory()) {
              fs.mkdirSync(dest, { mode: 0o755 });
              for (const entry of fs.readdirSync(src).sort()) copyTree(path.join(src, entry), path.join(dest, entry));
            } else if (st.isFile()) {
              fs.writeFileSync(dest, fs.readFileSync(src), { mode: 0o644, flag: "wx" });
            } else {
              throw new Error(`${path.relative(CONFIG.workdir, src)} is a symlink or special file`);
            }
          }

          // Handles a collect request; the sandbox user has no process left, so
          // nothing changes the tree while it is copied.
          function collect({ name, path: rel }) {
            if (!/^[A-Za-z0-9_-]+$/.test(name ?? "")) throw new Error(`invalid upload name ${JSON.stringify(name)}`);
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === ".." || c === "")) {
              throw new Error(`invalid upload path ${JSON.stringify(rel)}`);
            }
            const src = path.join(CONFIG.workdir, rel);
            let real;
            try {
              real = fs.realpathSync(src);
            } catch (e) {
              throw new Error(`${rel}: ${e.code}`);
            }
            if (real !== src) throw new Error(`${rel} goes through a symlink`);
            const dest = path.join(COLLECT_DIR, name);
            fs.rmSync(dest, { recursive: true, force: true });
            fs.mkdirSync(dest, { mode: 0o755 });
            try {
              copyTree(src, path.join(dest, path.basename(src)));
            } catch (e) {
              fs.rmSync(dest, { recursive: true, force: true });
              throw e;
            }
          }

          let req;
          try {
            req = JSON.parse(fs.readFileSync(0, "utf8"));
          } catch (e) {
            fail(`invalid request: ${e.message}`);
          }
          if (!/^[0-9a-f]{32}$/.test(req.id ?? "")) fail("invalid step id");
          if (typeof req.script !== "string" && typeof req.collect !== "object") fail("missing script");
          const env = req.env ?? {};
          for (const [k, v] of Object.entries(env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)) fail(`invalid variable name ${JSON.stringify(k)}`);
            if (DENIED_ENV.test(k)) fail(`${k} cannot be passed into the sandbox`);
            if (typeof v !== "string" || /[\0\n\r]/.test(v)) fail(`${k}: values must be single-line strings`);
          }

          // pam_systemd moves each step into a session scope, which outlives the
          // service when the step leaves a process behind, and the user's systemd
          // manager can run more. Stopping the user's slice ends all of them, and
          // systemctl waits until they are gone. It runs before each step too, for a
          // step whose run.cjs was killed (a timeout, a cancel) before it got to
          // stop its own; cron, at and lingering are denied to the sandbox user, so
          // nothing can start its processes outside a step.
          function stopSandboxProcesses() {
            const r = spawnSync("systemctl", ["stop", `user-${CONFIG.uid}.slice`], { stdio: ["ignore", "inherit", "inherit"] });
            return r.status === 0 ? null : `could not stop the sandbox user's processes (${r.error ?? `exit ${r.status}`})`;
          }

          const user = CONFIG.user;
          const stopError = stopSandboxProcesses();
          if (stopError) fail(stopError);
          if (req.collect) {
            let result = { status: 0, output: "", summary: "" };
            try {
              collect(req.collect);
            } catch (e) {
              result = { status: 1, error: `upload: ${e.message}` };
            }
            fs.writeFileSync(path.join(RESULTS_DIR, `${req.id}.json`), JSON.stringify(result), { mode: 0o644, flag: "wx" });
            process.exit(result.status);
          }
          const stepDir = path.join(STEPS_DIR, req.id);
          const outDir = path.join(stepDir, "out");
          fs.mkdirSync(stepDir, { mode: 0o755 }); // fails if the id was used before
          fs.writeFileSync(path.join(stepDir, "script.sh"), req.script, { mode: 0o644 });
          fs.mkdirSync(outDir, { mode: 0o700 });
          fs.chownSync(outDir, CONFIG.uid, CONFIG.gid);

          const vars = {
            ...env,
            LANG: "C.UTF-8", PATH: SANDBOX_PATH,
            GITHUB_OUTPUT: path.join(outDir, "output"),
            GITHUB_STEP_SUMMARY: path.join(outDir, "summary"),
          };
          // run0 starts the script as a transient service through its own PAM stack
          // (no pam_env), so pam_systemd gives it a logind session like an SSH login
          // gets: XDG_RUNTIME_DIR and the user's systemd manager, which rootless
          // podman needs. It sets HOME, USER, LOGNAME and SHELL for the sandbox user
          // itself. It also sets SUDO_USER and friends as sudo would, which tools
          // take to mean they run under sudo, and --setenv can't unset them, hence
          // the env -u. Unlike systemd-run --collect, run0 would leave a failed unit
          // behind for every step that fails, so collect those too.
          const argv = [
            "--pipe", "--no-ask-password", "--shell-prompt-prefix=", `--user=${user}`, `--chdir=${CONFIG.workdir}`,
            "--property=CollectMode=inactive-or-failed",
            // The sandbox gets its own /tmp, so it can't leave files there for the
            // runner's later steps; the runner's home is hidden outright.
            "--property=PrivateTmp=yes", `--property=InaccessiblePaths=-${CONFIG.runnerHome}`,
            ...Object.entries(vars).map(([k, v]) => `--setenv=${k}=${v}`),
            "--", "env", ...SUDO_VARS.flatMap((v) => ["-u", v]), "--",
            "/bin/bash", "--noprofile", "--norc", "-e", "-o", "pipefail", path.join(stepDir, "script.sh"),
          ];
          // run0 hands stdio to PID 1 over D-Bus, which accepts pipes but not every
          // file type, so give it an empty pipe rather than /dev/null.
          const r = spawnSync("run0", argv, { stdio: ["pipe", "inherit", "inherit"], input: "" });
          const status = r.status ?? 125;

          // Every process of the step is gone after this, so none can touch the
          // files read below.
          const stopAfter = stopSandboxProcesses();
          let result;
          try {
            if (stopAfter) throw new Error(stopAfter);
            result = { status, output: readSandboxFile(path.join(outDir, "output")), summary: readSandboxFile(path.join(outDir, "summary")) };
          } catch (e) {
            result = { status: 125, error: e.message };
          }
          fs.rmSync(stepDir, { recursive: true, force: true });
          fs.writeFileSync(path.join(RESULTS_DIR, `${req.id}.json`), JSON.stringify(result), { mode: 0o644, flag: "wx" });
          process.exit(status);
      name: Enter the sandbox (generated)
      run: |
        const CONFIG = {
          "handoff": {
            "include": [],
            "workspace": "tracked"
          },
          "lockRunnerSudo": true,
          "user": "runner-sandbox",
          "workspace": "${{ github.workspace }}"
        };
        // The compiler-generated "enter the sandbox" step, run as root (`sudo node`)
        // right after the job's runner_steps. The compiler prepends
        // `const CONFIG = {...};` to this file and passes the two halves of the step
        // wrapper as RUNNER_SANDBOX_EXEC_JS and RUNNER_SANDBOX_RUN_JS, and the
        // workspace hand-off (handoff.cjs) as RUNNER_SANDBOX_HANDOFF_JS.
        //
        // It creates the sandbox user, hands it the workspace, installs
        // the two halves of the step wrapper, and (with CONFIG.lockRunnerSudo) takes
        // root away from the runner user, whose only remaining sudo rule is the
        // wrapper. From here on, the job's run steps execute as the sandbox user.
        const fs = require("node:fs");
        const path = require("node:path");
        const { spawnSync } = require("node:child_process");

        const CONFIG_DIR = "/etc/runner-sandbox";
        const EXEC = "/usr/local/bin/runner-sandbox-exec";
        const RUN = "/usr/local/libexec/runner-sandbox-run";
        const SUDOERS = "/etc/sudoers.d/zz-runner-sandbox";
        const WORKDIR = "/var/lib/runner-sandbox/work";
        const DOCKER_UNITS = ["docker.socket", "docker.service", "containerd.service"];

        function run(cmd, args, { check = true } = {}) {
          const r = spawnSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] });
          if (check && r.status !== 0) throw new Error(`${cmd} ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return { status: r.status, stdout: (r.stdout ?? "").trim() };
        }

        function passwd(name) {
          const [, , uid, gid, , home] = run("getent", ["passwd", name]).stdout.split(":");
          return { uid: Number(uid), gid: Number(gid), home };
        }

        if (process.getuid() !== 0) throw new Error("must run as root");
        // Sandboxed steps run through run0 (systemd 256 or later): ubuntu-26.04 and
        // RHEL 10 have it, ubuntu-24.04 (systemd 255) does not.
        if (run("sh", ["-c", "command -v run0"], { check: false }).status !== 0) {
          throw new Error("run0 not found: sandboxed steps need systemd 256 or later (e.g. runs-on: ubuntu-26.04)");
        }
        const runner = process.env.SUDO_USER;
        if (!runner || runner === "root") throw new Error("must be started with sudo by the runner user");
        const user = CONFIG.user;

        // A runner that ran a job before would hand this one the previous job's
        // sandbox and workspace: refuse it. (The user itself may come with the
        // image, as on the devspace runners.)
        if (fs.existsSync(path.dirname(WORKDIR))) {
          throw new Error(`${path.dirname(WORKDIR)} already exists: the sandbox needs a fresh, ephemeral runner`);
        }
        if (run("getent", ["passwd", user], { check: false }).status !== 0) {
          run("useradd", ["--create-home", "--user-group", "--shell", "/bin/bash", user]);
        }
        const sandbox = passwd(user);
        const runnerHome = passwd(runner).home;

        fs.mkdirSync(CONFIG_DIR, { recursive: true, mode: 0o755 });
        // The sandbox works on its own copy of what the job hands it (the files git
        // tracks, by default); the runner's home, which holds the runner's
        // credentials and the job's temp files, is closed.
        const HANDOFF = `${CONFIG_DIR}/handoff.cjs`;
        fs.writeFileSync(HANDOFF, process.env.RUNNER_SANDBOX_HANDOFF_JS ?? "", { mode: 0o644 });
        const { handoff } = require(HANDOFF);
        const copied = handoff({
          workspace: CONFIG.workspace,
          dest: WORKDIR,
          mode: CONFIG.handoff.workspace,
          include: CONFIG.handoff.include,
          owner: sandbox,
          // As runner, whose checkout it is: git as root would read the runner's
          // repository configuration.
          listTracked: () => {
            const r = spawnSync("runuser", ["-u", runner, "--", "git", "-C", CONFIG.workspace, "ls-files", "-z", "-s"], { encoding: "utf8", maxBuffer: 1 << 30 });
            if (r.status !== 0) throw new Error(`handoff.workspace = 'tracked needs a git checkout in ${CONFIG.workspace} (use 'all or 'none otherwise): ${(r.stderr ?? "").trim()}`);
            return r.stdout;
          },
        });
        console.log(`Handed ${copied} workspace entries (${CONFIG.handoff.workspace}) to ${user} in ${WORKDIR}`);
        fs.chmodSync(runnerHome, 0o700);

        fs.writeFileSync(`${CONFIG_DIR}/config.json`, JSON.stringify({ user, ...sandbox, workdir: WORKDIR, runnerHome }), { mode: 0o644 });
        // runner-sandbox-run runs as root under this node, through the one sudo
        // rule runner keeps, so the binary and every directory above it must be
        // root's alone: a runner-owned node, as in a tool cache, would give runner
        // root.
        const node = fs.realpathSync(process.execPath);
        for (let p = node; ; p = path.dirname(p)) {
          const st = fs.statSync(p);
          if (st.uid !== 0 || st.mode & 0o002 || (st.mode & 0o020 && st.gid !== 0)) {
            throw new Error(`${p} must be owned by root and writable only by root: the step wrapper runs as root under ${node}`);
          }
          if (p === "/") break;
        }
        fs.mkdirSync("/usr/local/libexec", { recursive: true });
        for (const [dest, text] of [[EXEC, process.env.RUNNER_SANDBOX_EXEC_JS], [RUN, process.env.RUNNER_SANDBOX_RUN_JS]]) {
          if (!text) throw new Error(`nothing to install at ${dest}`);
          fs.writeFileSync(dest, `#!${node}\n${text}`, { mode: 0o755 });
          fs.chmodSync(dest, 0o755);
        }
        for (const d of ["/run/runner-sandbox/steps", "/run/runner-sandbox/results", "/run/runner-sandbox/collect"]) {
          fs.mkdirSync(d, { recursive: true, mode: 0o755 });
        }

        // Nothing may start the sandbox user's processes outside a step, where the
        // wrapper can't stop them: no cron, no at, no lingering user manager (whose
        // polkit action, like every other, is denied to it below).
        for (const deny of ["/etc/cron.deny", "/etc/at.deny"]) {
          const lines = fs.existsSync(deny) ? fs.readFileSync(deny, "utf8").split("\n") : [];
          if (!lines.includes(user)) fs.appendFileSync(deny, `${user}\n`, { mode: 0o600 });
        }
        run("loginctl", ["disable-linger", user]);
        if (fs.existsSync("/etc/polkit-1")) {
          fs.mkdirSync("/etc/polkit-1/rules.d", { recursive: true, mode: 0o755 });
          fs.writeFileSync("/etc/polkit-1/rules.d/00-runner-sandbox.rules", `polkit.addRule(function(action, subject) {
          if (subject.user == ${JSON.stringify(user)}) return polkit.Result.NO;
        });
        `, { mode: 0o644 });
        }

        // The last matching sudoers rule wins, and this file is read last.
        let sudoers = `${user} ALL=(ALL:ALL) !ALL\n`;
        if (CONFIG.lockRunnerSudo) {
          sudoers += `${runner} ALL=(ALL:ALL) !ALL\n${runner} ALL=(root) NOPASSWD: ${RUN} ""\n`;
        }
        fs.writeFileSync(`${SUDOERS}.tmp`, sudoers, { mode: 0o440 });
        run("visudo", ["-cq", "-f", `${SUDOERS}.tmp`]);
        fs.renameSync(`${SUDOERS}.tmp`, SUDOERS);

        if (CONFIG.lockRunnerSudo) {
          // The runner user is in the docker group, and processes the runner
          // already started keep that group; a daemon that isn't running can't
          // be asked for a root container.
          const present = DOCKER_UNITS.filter((u) => run("systemctl", ["cat", u], { check: false }).status === 0);
          if (present.length) run("systemctl", ["stop", ...present]);
          // Fail closed: the runner must have lost root, and kept only the wrapper.
          if (run("runuser", ["-u", runner, "--", "sudo", "-n", "true"], { check: false }).status === 0) {
            throw new Error(`${runner} still has sudo after the lock`);
          }
          run("runuser", ["-u", runner, "--", "sudo", "-n", "-l", RUN]);
        }
        console.log(`Entered the sandbox: later run steps execute as ${user} (uid ${sandbox.uid}) in ${WORKDIR}`);
        console.log(run("sudo", ["-l", "-U", runner]).stdout);
      shell: sudo --preserve-env=RUNNER_SANDBOX_EXEC_JS,RUNNER_SANDBOX_RUN_JS,RUNNER_SANDBOX_HANDOFF_JS node {0}
