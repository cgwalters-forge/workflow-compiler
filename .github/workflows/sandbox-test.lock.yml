# Generated by workflow-compiler from workflows/sandbox-test.ncl; do not edit.
# Regenerate with: node compile.mjs
jobs:
  sandbox:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install a tool system-wide
      run: |-
        sudo tee /usr/local/bin/hello-tool >/dev/null <<'EOF'
        #!/bin/sh
        echo "installed by runner_steps, run by $(id -un)"
        EOF
        sudo chmod 0755 /usr/local/bin/hello-tool
      shell: bash
    - env:
        RUNNER_SANDBOX_EXEC_JS: |
          // Runner side of a sandboxed step, used as its shell
          // (`shell: /usr/local/bin/runner-sandbox-exec {0}`). It runs as the runner
          // user, which holds the job's credentials, so it passes along only the step
          // script, the variables the compiler listed in RUNNER_SANDBOX_ENV and a
          // fixed set of non-secret context variables, and asks runner-sandbox-run
          // (through sudo) to run the script as the sandbox user. Afterwards it copies
          // the step's outputs and summary into the runner's own files, accepting only
          // plain name=value output lines.
          "use strict";
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { spawnSync } = require("node:child_process");

          const RUN = "/usr/local/libexec/runner-sandbox-run";
          const RESULTS_DIR = "/run/runner-sandbox/results";
          const CONTEXT_ENV = [
            "CI", "GITHUB_ACTIONS", "GITHUB_ACTOR", "GITHUB_EVENT_NAME", "GITHUB_JOB", "GITHUB_REF", "GITHUB_REF_NAME",
            "GITHUB_REPOSITORY", "GITHUB_RUN_ATTEMPT", "GITHUB_RUN_ID", "GITHUB_SERVER_URL", "GITHUB_SHA", "GITHUB_WORKFLOW",
          ];
          const OUTPUT_LINE = /^[A-Za-z_][A-Za-z0-9_-]*=[^\r]*$/;

          function fail(message) {
            console.error(`runner-sandbox-exec: ${message}`);
            process.exit(125);
          }

          const scriptPath = process.argv[2];
          if (!scriptPath || process.argv.length !== 3) fail("usage: runner-sandbox-exec SCRIPT");
          const names = (process.env.RUNNER_SANDBOX_ENV ?? "").split(",").filter(Boolean);
          const env = {};
          for (const name of [...CONTEXT_ENV, ...names]) {
            if (process.env[name] !== undefined) env[name] = process.env[name];
          }
          const id = crypto.randomBytes(16).toString("hex");
          const request = JSON.stringify({ id, script: fs.readFileSync(scriptPath, "utf8"), env });
          const r = spawnSync("sudo", ["-n", RUN], { input: request, stdio: ["pipe", "inherit", "inherit"] });
          if (r.error) fail(`running ${RUN}: ${r.error.message}`);

          let result;
          try {
            result = JSON.parse(fs.readFileSync(`${RESULTS_DIR}/${id}.json`, "utf8"));
          } catch (e) {
            fail(`no result from the sandbox (exit ${r.status}): ${e.message}`);
          }
          if (result.error) fail(result.error);
          const lines = result.output.split("\n").filter((l) => l !== "");
          const bad = lines.find((l) => !OUTPUT_LINE.test(l));
          if (bad !== undefined) fail(`refusing GITHUB_OUTPUT line ${JSON.stringify(bad.slice(0, 80))}: only name=value lines are accepted`);
          if (lines.length) fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          if (result.summary) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, result.summary);
          process.exit(result.status);
        RUNNER_SANDBOX_RUN_JS: |
          // Root side of a sandboxed step: runner-sandbox-exec pipes a request
          // ({id, script, env}) to this program through `sudo -n`, the one command the
          // runner user may still run as root once the job has entered the sandbox.
          // It runs the script as the sandbox user with run0, in a login session of
          // its own and with a fixed environment, then hands back what the step wrote to its
          // GITHUB_OUTPUT and GITHUB_STEP_SUMMARY. Nothing here trusts the request: its
          // fields are validated, and the files the sandbox wrote are read without
          // following symlinks.
          "use strict";
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const CONFIG = JSON.parse(fs.readFileSync("/etc/runner-sandbox/config.json", "utf8"));
          const STEPS_DIR = "/run/runner-sandbox/steps";
          const RESULTS_DIR = "/run/runner-sandbox/results";
          const MAX_FILE = 1 << 20;
          const SANDBOX_PATH = "/usr/local/bin:/usr/bin:/bin";
          const SUDO_VARS = ["SUDO_USER", "SUDO_UID", "SUDO_GID", "SUDO_HOME"];
          // Variables the request may not set: the runner's credentials and anything
          // that changes how the sandbox's own programs start.
          const DENIED_ENV = /^(ACTIONS_|GITHUB_TOKEN$|GITHUB_ENV$|GITHUB_PATH$|GITHUB_OUTPUT$|GITHUB_STATE$|GITHUB_STEP_SUMMARY$|RUNNER_|LD_|BASH_ENV$|ENV$|NODE_OPTIONS$|PATH$|HOME$|USER$|LOGNAME$|SHELL$)/;

          function fail(message) {
            console.error(`runner-sandbox-run: ${message}`);
            process.exit(125);
          }

          // Reads a file the sandbox user wrote, refusing symlinks and oversized files.
          function readSandboxFile(file) {
            let fd;
            try {
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
            } catch (e) {
              if (e.code === "ENOENT") return "";
              throw new Error(`${path.basename(file)}: ${e.code}`);
            }
            try {
              const st = fs.fstatSync(fd);
              if (!st.isFile()) throw new Error(`${path.basename(file)} is not a regular file`);
              if (st.size > MAX_FILE) throw new Error(`${path.basename(file)} is larger than ${MAX_FILE} bytes`);
              return fs.readFileSync(fd, "utf8");
            } finally {
              fs.closeSync(fd);
            }
          }

          let req;
          try {
            req = JSON.parse(fs.readFileSync(0, "utf8"));
          } catch (e) {
            fail(`invalid request: ${e.message}`);
          }
          if (!/^[0-9a-f]{32}$/.test(req.id ?? "")) fail("invalid step id");
          if (typeof req.script !== "string") fail("missing script");
          const env = req.env ?? {};
          for (const [k, v] of Object.entries(env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)) fail(`invalid variable name ${JSON.stringify(k)}`);
            if (DENIED_ENV.test(k)) fail(`${k} cannot be passed into the sandbox`);
            if (typeof v !== "string" || /[\0\n\r]/.test(v)) fail(`${k}: values must be single-line strings`);
          }

          const user = CONFIG.user;
          const stepDir = path.join(STEPS_DIR, req.id);
          const outDir = path.join(stepDir, "out");
          fs.mkdirSync(stepDir, { mode: 0o755 }); // fails if the id was used before
          fs.writeFileSync(path.join(stepDir, "script.sh"), req.script, { mode: 0o644 });
          fs.mkdirSync(outDir, { mode: 0o700 });
          fs.chownSync(outDir, CONFIG.uid, CONFIG.gid);

          const vars = {
            ...env,
            LANG: "C.UTF-8", PATH: SANDBOX_PATH,
            GITHUB_OUTPUT: path.join(outDir, "output"),
            GITHUB_STEP_SUMMARY: path.join(outDir, "summary"),
          };
          // run0 starts the script as a transient service through its own PAM stack
          // (no pam_env), so pam_systemd gives it a logind session like an SSH login
          // gets: XDG_RUNTIME_DIR and the user's systemd manager, which rootless
          // podman needs. It sets HOME, USER, LOGNAME and SHELL for the sandbox user
          // itself. It also sets SUDO_USER and friends as sudo would, which tools
          // take to mean they run under sudo, and --setenv can't unset them, hence
          // the env -u. Unlike systemd-run --collect, run0 would leave a failed unit
          // behind for every step that fails, so collect those too.
          const argv = [
            "--pipe", "--no-ask-password", "--shell-prompt-prefix=", `--user=${user}`, `--chdir=${CONFIG.workdir}`,
            "--property=CollectMode=inactive-or-failed",
            // The sandbox gets its own /tmp, so it can't leave files there for the
            // runner's later steps; the runner's home is hidden outright.
            "--property=PrivateTmp=yes", `--property=InaccessiblePaths=-${CONFIG.runnerHome}`,
            ...Object.entries(vars).map(([k, v]) => `--setenv=${k}=${v}`),
            "--", "env", ...SUDO_VARS.flatMap((v) => ["-u", v]), "--",
            "/bin/bash", "--noprofile", "--norc", "-e", "-o", "pipefail", path.join(stepDir, "script.sh"),
          ];
          // run0 hands stdio to PID 1 over D-Bus, which accepts pipes but not every
          // file type, so give it an empty pipe rather than /dev/null.
          const r = spawnSync("run0", argv, { stdio: ["pipe", "inherit", "inherit"], input: "" });
          const status = r.status ?? 125;

          // pam_systemd moved the step into a session scope, which outlives the
          // service when the step leaves a process behind, and the user's systemd
          // manager can run more. Stopping the user's slice ends all of them, and
          // systemctl waits until they are gone, so each step starts with no process
          // of the sandbox user left and none can touch the files read below.
          const stop = spawnSync("systemctl", ["stop", `user-${CONFIG.uid}.slice`], { stdio: ["ignore", "inherit", "inherit"] });
          let result;
          try {
            if (stop.status !== 0) throw new Error(`could not stop the sandbox user's processes (${stop.error ?? `exit ${stop.status}`})`);
            result = { status, output: readSandboxFile(path.join(outDir, "output")), summary: readSandboxFile(path.join(outDir, "summary")) };
          } catch (e) {
            result = { status: 125, error: e.message };
          }
          fs.rmSync(stepDir, { recursive: true, force: true });
          fs.writeFileSync(path.join(RESULTS_DIR, `${req.id}.json`), JSON.stringify(result), { mode: 0o644, flag: "wx" });
          process.exit(status);
      name: Enter the sandbox (generated)
      run: |
        const CONFIG = {
          "lockRunnerSudo": true,
          "user": "runner-sandbox",
          "workspace": "${{ github.workspace }}"
        };
        // The compiler-generated "enter the sandbox" step, run as root (`sudo node`)
        // right after the job's runner_steps. The compiler prepends
        // `const CONFIG = {...};` to this file and passes the two halves of the step
        // wrapper as RUNNER_SANDBOX_EXEC_JS and RUNNER_SANDBOX_RUN_JS.
        //
        // It creates the sandbox user, gives it a copy of the workspace, installs
        // the two halves of the step wrapper, and (with CONFIG.lockRunnerSudo) takes
        // root away from the runner user, whose only remaining sudo rule is the
        // wrapper. From here on, the job's run steps execute as the sandbox user.
        const fs = require("node:fs");
        const { spawnSync } = require("node:child_process");

        const CONFIG_DIR = "/etc/runner-sandbox";
        const EXEC = "/usr/local/bin/runner-sandbox-exec";
        const RUN = "/usr/local/libexec/runner-sandbox-run";
        const SUDOERS = "/etc/sudoers.d/zz-runner-sandbox";
        const WORKDIR = "/var/lib/runner-sandbox/work";
        const DOCKER_UNITS = ["docker.socket", "docker.service", "containerd.service"];

        function run(cmd, args, { check = true } = {}) {
          const r = spawnSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] });
          if (check && r.status !== 0) throw new Error(`${cmd} ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return { status: r.status, stdout: (r.stdout ?? "").trim() };
        }

        function passwd(name) {
          const [, , uid, gid, , home] = run("getent", ["passwd", name]).stdout.split(":");
          return { uid: Number(uid), gid: Number(gid), home };
        }

        if (process.getuid() !== 0) throw new Error("must run as root");
        // Sandboxed steps run through run0 (systemd 256 or later): ubuntu-26.04 and
        // RHEL 10 have it, ubuntu-24.04 (systemd 255) does not.
        if (run("sh", ["-c", "command -v run0"], { check: false }).status !== 0) {
          throw new Error("run0 not found: sandboxed steps need systemd 256 or later (e.g. runs-on: ubuntu-26.04)");
        }
        const runner = process.env.SUDO_USER;
        if (!runner || runner === "root") throw new Error("must be started with sudo by the runner user");
        const user = CONFIG.user;

        if (run("getent", ["passwd", user], { check: false }).status !== 0) {
          run("useradd", ["--create-home", "--user-group", "--shell", "/bin/bash", user]);
        }
        const sandbox = passwd(user);
        const runnerHome = passwd(runner).home;

        // The sandbox works on its own copy of the checkout; the runner's home,
        // which holds the runner's credentials and the job's temp files, is closed.
        fs.mkdirSync(WORKDIR, { recursive: true });
        run("cp", ["-a", `${CONFIG.workspace}/.`, WORKDIR]);
        run("chown", ["-R", `${sandbox.uid}:${sandbox.gid}`, WORKDIR]);
        fs.chmodSync(runnerHome, 0o700);

        fs.mkdirSync(CONFIG_DIR, { recursive: true, mode: 0o755 });
        fs.writeFileSync(`${CONFIG_DIR}/config.json`, JSON.stringify({ user, ...sandbox, workdir: WORKDIR, runnerHome }), { mode: 0o644 });
        fs.mkdirSync("/usr/local/libexec", { recursive: true });
        for (const [dest, text] of [[EXEC, process.env.RUNNER_SANDBOX_EXEC_JS], [RUN, process.env.RUNNER_SANDBOX_RUN_JS]]) {
          if (!text) throw new Error(`nothing to install at ${dest}`);
          fs.writeFileSync(dest, `#!${process.execPath}\n${text}`, { mode: 0o755 });
          fs.chmodSync(dest, 0o755);
        }
        for (const d of ["/run/runner-sandbox/steps", "/run/runner-sandbox/results"]) {
          fs.mkdirSync(d, { recursive: true, mode: 0o755 });
        }

        // The last matching sudoers rule wins, and this file is read last.
        let sudoers = `${user} ALL=(ALL:ALL) !ALL\n`;
        if (CONFIG.lockRunnerSudo) {
          sudoers += `${runner} ALL=(ALL:ALL) !ALL\n${runner} ALL=(root) NOPASSWD: ${RUN} ""\n`;
        }
        fs.writeFileSync(`${SUDOERS}.tmp`, sudoers, { mode: 0o440 });
        run("visudo", ["-cq", "-f", `${SUDOERS}.tmp`]);
        fs.renameSync(`${SUDOERS}.tmp`, SUDOERS);

        if (CONFIG.lockRunnerSudo) {
          // The runner user is in the docker group, and processes the runner
          // already started keep that group; a daemon that isn't running can't
          // be asked for a root container.
          const present = DOCKER_UNITS.filter((u) => run("systemctl", ["cat", u], { check: false }).status === 0);
          if (present.length) run("systemctl", ["stop", ...present]);
          // Fail closed: the runner must have lost root, and kept only the wrapper.
          if (run("runuser", ["-u", runner, "--", "sudo", "-n", "true"], { check: false }).status === 0) {
            throw new Error(`${runner} still has sudo after the lock`);
          }
          run("runuser", ["-u", runner, "--", "sudo", "-n", "-l", RUN]);
        }
        console.log(`Entered the sandbox: later run steps execute as ${user} (uid ${sandbox.uid}) in ${WORKDIR}`);
        console.log(run("sudo", ["-l", "-U", runner]).stdout);
      shell: sudo --preserve-env=RUNNER_SANDBOX_EXEC_JS,RUNNER_SANDBOX_RUN_JS node {0}
    - name: Runs as the sandbox user
      run: |-
        id
        test "$(id -un)" = runner-sandbox
        test "$PWD" = /var/lib/runner-sandbox/work
        test -f LICENSE
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - name: Runs in a login session of its own, not as if under sudo
      run: |-
        test "$XDG_RUNTIME_DIR" = "/run/user/$(id -u)"
        loginctl show-session "$XDG_SESSION_ID" -p Name -p Class
        test "$(loginctl show-session "$XDG_SESSION_ID" -p Name --value)" = runner-sandbox
        if env | grep ^SUDO_; then echo "SUDO_* leaked into the sandbox"; exit 1; fi
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - continue-on-error: true
      id: sudo
      name: sudo is refused
      run: sudo -n true
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - env:
        OUTCOME: ${{ steps.sudo.outcome }}
        RUNNER_SANDBOX_ENV: OUTCOME
      name: The sudo step failed
      run: test "$OUTCOME" = failure
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - name: The job's credentials are out of reach
      run: |-
        for v in ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN GITHUB_ENV GITHUB_PATH; do
          if [[ -v $v ]]; then echo "$v is set"; exit 1; fi
        done
        worker=$(pgrep -f Runner.Worker | head -n1)
        test -n "$worker"
        if cat "/proc/$worker/environ" >/dev/null; then echo "read Runner.Worker's environment"; exit 1; fi
        if ls /home/runner >/dev/null; then echo "listed the runner's home"; exit 1; fi
        if docker ps >/dev/null 2>&1; then echo "reached a docker daemon"; exit 1; fi
        echo "no credentials reachable"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - name: Use what runner_steps installed
      run: hello-tool | tee hello.log
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - id: out
      name: Write a step output
      run: |-
        echo "answer=42" >>"$GITHUB_OUTPUT"
        echo "Written from the sandbox by $(id -un)" >>"$GITHUB_STEP_SUMMARY"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - env:
        ANSWER: ${{ steps.out.outputs.answer }}
        RUNNER_SANDBOX_ENV: ANSWER
      name: Read it back
      run: test "$ANSWER" = 42
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - continue-on-error: true
      id: symlink
      name: Point GITHUB_OUTPUT at a root-only file
      run: ln -sf /etc/shadow "$GITHUB_OUTPUT"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - continue-on-error: true
      id: heredoc
      name: Smuggle a multi-line output
      run: printf 'x<<EOF\nsomething\nEOF\n' >>"$GITHUB_OUTPUT"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - name: Leave a process behind
      run: setsid sleep 600 </dev/null >/dev/null 2>&1 & echo "started $!"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - env:
        HEREDOC: ${{ steps.heredoc.outcome }}
        RUNNER_SANDBOX_ENV: HEREDOC,SYMLINK
        SYMLINK: ${{ steps.symlink.outcome }}
      name: The escapes failed
      run: |-
        test "$SYMLINK" = failure
        test "$HEREDOC" = failure
        if pgrep -u runner-sandbox -x sleep; then echo "a process survived its step"; exit 1; fi
        echo "all escapes failed"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - if: always()
      name: Upload what the sandbox wrote
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sandbox-test
        path: /var/lib/runner-sandbox/work/hello.log
    timeout-minutes: 15
name: Sandbox test
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
