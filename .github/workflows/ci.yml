# The one job named ci is what the main branch ruleset requires; it passes
# only when every other job does.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      # Relative links and anchors only: external sites make CI flaky.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "**/*.md"
          fail: true

  # The compiler, wfc: formatting, lints, its tests, and its check of this
  # repository (tests/repo.rs), where every lock file must match its
  # source and every source in tests/reject/ must fail to compile with the
  # message it expects.
  compile:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # `wfc check` (in cargo test) lints imported scripts with shellcheck
      # only when it is installed; here it must be.
      - run: shellcheck --version
      - run: cargo test --locked
      - name: Unit tests of the runtime scripts
        run: node --test 'tests/runtime/*.test.cjs'
      # Also catches an expression in an embedded runtime script, which
      # Actions would expand as the step starts.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  # The compiled workflows themselves, on real hosted runners.
  sandbox-test:
    uses: ./.github/workflows/sandbox-test.lock.yml
  # sandbox-test tried to upload the runner's secrets through symlinks.
  sandbox-test-artifacts:
    needs: sandbox-test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: No artifact holds the runtime token or the runner's secret
        run: |
          find artifacts -ls
          # A single artifact is downloaded without a directory of its own.
          find artifacts -name hello.log | grep -q .
          if find artifacts -name 'leak-*' | grep .; then echo "a leak- artifact was uploaded"; exit 1; fi
          if grep -rlE 'ACTIONS_RUNTIME_TOKEN|RUNNER-SECRET-MARKER' artifacts; then echo "an artifact leaked a secret"; exit 1; fi
  agent-review:
    uses: ./.github/workflows/agent-review.lock.yml
  # What agent-review's fake agent run produced, through stage, seal and
  # publish: the task layer's summary.json and the ACP transcript.
  agent-review-artifacts:
    needs: agent-review
    runs-on: ubuntu-26.04
    env:
      # The bot-harness commit lib/agent-run.ncl pins, for redact.mjs's
      # patterns.
      HARNESS_SHA: 13308dc5480bc9f89dbf4b9abfabc7972222db8e
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-*
      # Each artifact holds the staged directory under its own name.
      - name: The run summary and transcript are complete
        env:
          RUN: agent-run/agent-run
          TRANSCRIPT: agent-transcript/agent-transcript
        run: |
          set -euo pipefail
          find agent-run agent-transcript -ls
          cat "$RUN/summary.md" >>"$GITHUB_STEP_SUMMARY"
          jq . "$RUN/summary.json"
          jq -e '.schema == "agent-run-summary/v1" and .agent == "fake" and .result == "success"' "$RUN/summary.json"
          jq -e '[.permissions.denied[].rule] | index("no-push") != null' "$RUN/summary.json"
          jq -e '.redactions >= 1 and (.files | index("FAKE.md") != null)' "$RUN/summary.json"
          # The fake agent's outcome.json, with the test it reports.
          jq -e '.tests | length == 1' "$RUN/outcome.json"
          test "$(wc -l <"$TRANSCRIPT/acp.jsonl")" -gt 10
          jq -e . "$TRANSCRIPT/harness.json" >/dev/null
          # Every escape the scripted agent tried failed (the old stub's
          # checks, now the agent's own; lib/agent-run.ncl).
          for e in rewrite-prompt add-to-share sudo worker-environ runner-home job-token; do
            grep -q "contained-$e" "$TRANSCRIPT/acp.jsonl" || { echo "no result for the $e attempt"; exit 1; }
          done
          if grep -o 'ESCAPED-[a-z-]*' "$TRANSCRIPT/acp.jsonl"; then echo "an escape attempt succeeded"; exit 1; fi
          # Nothing uploaded matches the redaction patterns.
          curl -sSfL -o redact.mjs "https://raw.githubusercontent.com/cgwalters-forge/cgwalters-devspace-sandbox/$HARNESS_SHA/agent/redact.mjs"
          # shellcheck disable=SC2016 # the ${} are JavaScript's
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            import { SECRET_PATTERNS } from "./redact.mjs";
            const re = new RegExp(SECRET_PATTERNS.map((p) => `(?:${p})`).join("|"));
            const files = readdirSync(".", { recursive: true }).filter((f) => /^agent-(run|transcript)\//.test(f));
            const bad = files.filter((f) => { try { return re.test(readFileSync(f, "utf8")); } catch { return false; } });
            if (bad.length) { console.error("secret-shaped strings in", bad); process.exit(1); }
            console.log(`${files.length} paths scanned, nothing secret-shaped`);
          ' 
          head -n 20 "$RUN/condensed.log"
  actions-test:
    uses: ./.github/workflows/actions-test.lock.yml

  # Skipped when the run is cancelled: concurrency cancels a run that a
  # newer one for the same ref supersedes (a stacked pull request's base
  # and head pushed together start two), and a failing ci there would show
  # on a head whose newer run passed. GitHub counts a skipped required job
  # as passed, so a run cancelled by hand needs a rerun before merging.
  ci:
    if: ${{ !cancelled() }}
    needs: [lint, compile, sandbox-test, sandbox-test-artifacts, agent-review, agent-review-artifacts, actions-test]
    runs-on: ubuntu-26.04
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success; done
