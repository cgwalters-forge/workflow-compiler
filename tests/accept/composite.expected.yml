jobs:
  t:
    runs-on: ubuntu-26.04
    steps:
    - env:
        RUNNER_SANDBOX_ACTIONS: |-
          [
            {
              "files": {
                "action.yml": "40861c568cc261ab0b694d873db7c5ce1013637b55719215eb0cc787ec9a6fb9"
              },
              "repo": "wfc-test/composite-ok",
              "sha": "0000000000000000000000000000000000000000"
            }
          ]
      name: Fetch the sandbox's actions (generated)
      run: |
        // The compiler-generated "fetch the sandbox's actions" step, run as root
        // (`sudo node`) before the sandbox is entered: fetches every action the
        // job's sandboxed steps use, at its pinned commit, into a root-owned
        // directory under ACTIONS_DIR, where the sandbox can read and run it but
        // not change it.
        //
        // RUNNER_SANDBOX_ACTIONS is the JSON list the compiler wrote from
        // actions.lock.json: [{repo, sha, files: {path: sha256}}], `files` being
        // each action's action.yml by its path in the repository. git checks that
        // the tree is the pinned commit's; the sha256 checks that the metadata the
        // compiler used is the metadata of that commit, so an edited lock file
        // fails here rather than running a different entry point.
        "use strict";
        const fs = require("node:fs");
        const path = require("node:path");
        const crypto = require("node:crypto");
        const { spawnSync } = require("node:child_process");

        const ACTIONS_DIR = "/opt/runner-sandbox/actions";
        const REPO_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
        const SHA_RE = /^[0-9a-f]{40}$/;

        function git(dir, args) {
          const r = spawnSync("git", ["-C", dir, "-c", "advice.detachedHead=false", ...args], { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] });
          if (r.status !== 0) throw new Error(`git ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return r.stdout.trim();
        }

        // root:root, directories 0755 and files keeping only their exec bit.
        function makeRootOwned(p) {
          const st = fs.lstatSync(p);
          fs.lchownSync(p, 0, 0);
          if (st.isSymbolicLink()) return;
          fs.chmodSync(p, st.isDirectory() || st.mode & 0o100 ? 0o755 : 0o644);
          if (st.isDirectory()) for (const e of fs.readdirSync(p)) makeRootOwned(path.join(p, e));
        }

        if (process.getuid() !== 0) throw new Error("must run as root");
        const actions = JSON.parse(process.env.RUNNER_SANDBOX_ACTIONS ?? "[]");
        fs.mkdirSync(ACTIONS_DIR, { recursive: true, mode: 0o755 });
        for (const { repo, sha, files } of actions) {
          if (!REPO_RE.test(repo) || !SHA_RE.test(sha)) throw new Error(`invalid action ${repo}@${sha}`);
          const dest = path.join(ACTIONS_DIR, repo, sha);
          const tmp = `${dest}.tmp`;
          fs.rmSync(tmp, { recursive: true, force: true });
          fs.mkdirSync(tmp, { recursive: true, mode: 0o755 });
          git(tmp, ["init", "-q"]);
          git(tmp, ["fetch", "-q", "--depth=1", "--no-tags", `https://github.com/${repo}`, sha]);
          git(tmp, ["checkout", "-q", "FETCH_HEAD"]);
          const head = git(tmp, ["rev-parse", "HEAD"]);
          if (head !== sha) throw new Error(`${repo}: fetched ${head}, not ${sha}`);
          fs.rmSync(path.join(tmp, ".git"), { recursive: true, force: true });
          for (const [file, sum] of Object.entries(files)) {
            const got = crypto.createHash("sha256").update(fs.readFileSync(path.join(tmp, file))).digest("hex");
            if (got !== sum) throw new Error(`${repo}@${sha}: ${file} has sha256 ${got}, but actions.lock.json says ${sum}`);
          }
          makeRootOwned(tmp);
          fs.rmSync(dest, { recursive: true, force: true });
          fs.renameSync(tmp, dest);
          console.log(`Fetched ${repo}@${sha} into ${dest}`);
        }
      shell: sudo --preserve-env=RUNNER_SANDBOX_ACTIONS node {0}
    - name: Secure the host (generated)
      run: |
        // The compiler-generated "secure the host" step, run as root (`sudo node`)
        // before the job enters the sandbox. It closes what runner images leave
        // open to every local user, which stops mattering only once some steps
        // run as a user other than runner. These are the image fixes from
        // cgwalters-devspace-sandbox's setup-runner-sandbox.mjs, for images like
        // the RHEL runners that are built with umask 000.
        //
        // TODO: replace this step with cgwalters-forge/actions/secure-host-setup,
        // pinned by commit, once it exists.
        "use strict";
        const fs = require("node:fs");
        const { spawnSync } = require("node:child_process");

        // The runner's .credentials and the hosted compute agent's token
        // (/opt/hca/.settings, RHEL runners only) are world-readable there.
        const PRIVATE_DIRS = ["/home/runner", "/opt/hca"];
        // Sticky world-writable directories, meant to stay that way.
        const SHARED_TMP = ["/tmp", "/var/tmp"];
        // Some images set XDG_RUNTIME_DIR to runner's here, and PAM hands it to
        // every session, which breaks other users' session bus and rootless podman.
        // https://github.com/actions/runner-images/issues/14649
        const ENVIRONMENT = "/etc/environment";
        const IMAGE_ENV_VARS = ["XDG_RUNTIME_DIR"];

        function run(cmd, args) {
          const r = spawnSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"], maxBuffer: 1 << 28 });
          if (r.status !== 0) throw new Error(`${cmd} ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return r.stdout.trim();
        }

        if (process.getuid() !== 0) throw new Error("must run as root");

        for (const dir of PRIVATE_DIRS.filter((d) => fs.existsSync(d))) {
          fs.chmodSync(dir, 0o700);
        }

        // World-writable system files include ones root loads code from (a polkit
        // rule, a unit): any user could make itself root through them.
        const prune = SHARED_TMP.flatMap((d) => ["-path", d, "-o"]);
        const fixed = run("find", ["/", "-xdev", "(", ...prune, "-false", ")", "-prune", "-o",
          "(", "-type", "f", "-o", "-type", "d", ")", "-perm", "-0002", "!", "-perm", "-1000",
          "-print", "-exec", "chmod", "o-w", "{}", "+"]);
        const paths = fixed ? fixed.split("\n") : [];
        console.log(`Removed world write access from ${paths.length} paths${paths.length ? `, such as:\n  ${paths.slice(0, 10).join("\n  ")}` : ""}`);

        if (fs.existsSync(ENVIRONMENT)) {
          const lines = fs.readFileSync(ENVIRONMENT, "utf8").split("\n");
          const kept = lines.filter((l) => !IMAGE_ENV_VARS.some((v) => l.trim().startsWith(`${v}=`)));
          if (kept.length !== lines.length) {
            const tmp = `${ENVIRONMENT}.secure-host`;
            fs.writeFileSync(tmp, kept.join("\n"), { mode: fs.statSync(ENVIRONMENT).mode & 0o7777 });
            fs.renameSync(tmp, ENVIRONMENT);
            // SELinux (RHEL): give the new file the label of the one it replaced.
            if (spawnSync("sh", ["-c", "command -v restorecon"], { stdio: "ignore" }).status === 0) run("restorecon", [ENVIRONMENT]);
            console.log(`Dropped ${IMAGE_ENV_VARS.join(", ")} from ${ENVIRONMENT}`);
          }
        }

        // Hardening only (the uid split is the boundary): some images let any
        // process attach to any other of its uid.
        fs.writeFileSync("/proc/sys/kernel/yama/ptrace_scope", "1\n");
      shell: sudo node {0}
    - env:
        RUNNER_SANDBOX_EXEC_JS: |
          // Runner side of a sandboxed step, used as its shell
          // (`shell: /usr/local/bin/runner-sandbox-exec {0}`). It runs as the runner
          // user, which holds the job's credentials, so it passes along only the step
          // script, the variables the compiler listed in RUNNER_SANDBOX_ENV and a
          // fixed set of non-secret context variables, and asks runner-sandbox-run
          // (through sudo) to run the script as the sandbox user. Afterwards it copies
          // the step's outputs and summary into the runner's own files, checking the
          // output names.
          //
          // `runner-sandbox-exec --action SPEC` runs a JavaScript action in the
          // sandbox instead: SPEC is the file the runner wrote from the step's
          // `run:`, the JSON {uses, entry, stateKey} the compiler generated, and
          // the action's inputs are in the step's env. `runner-sandbox-exec
          // --action-path USES SCRIPT` runs a `run:` step of the composite action
          // USES. `runner-sandbox-exec --stage NAME PATH` has the root side copy
          // PATH out of the sandbox for a generated stage step, and
          // `runner-sandbox-exec --seal` has it seal the sandbox after the last
          // sandboxed step.
          //
          // Outputs come back as name=value lines or in the heredoc form, and are
          // written to the runner's GITHUB_OUTPUT re-encoded with a delimiter of
          // this side's choosing (filecmd.cjs).
          "use strict";
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { spawnSync } = require("node:child_process");
          const { parse, format, neutralize, allowedCommands } = require("/usr/local/libexec/runner-sandbox-filecmd.cjs");

          const RUN = "/usr/local/libexec/runner-sandbox-run";
          const SUDO = "/usr/bin/sudo";
          const RESULTS_DIR = "/run/runner-sandbox/results";
          const CONTEXT_ENV = [
            "CI", "GITHUB_ACTIONS", "GITHUB_ACTOR", "GITHUB_EVENT_NAME", "GITHUB_JOB", "GITHUB_REF", "GITHUB_REF_NAME",
            "GITHUB_REPOSITORY", "GITHUB_RUN_ATTEMPT", "GITHUB_RUN_ID", "GITHUB_SERVER_URL", "GITHUB_SHA", "GITHUB_WORKFLOW",
          ];
          const USAGE = "usage: runner-sandbox-exec SCRIPT | --action SPEC | --action-path USES SCRIPT | --stage NAME PATH | --seal";

          // Set to 0 by the compiler for a step whose output may hold no
          // annotations (filecmd.cjs), such as an agent's.
          const annotations = process.env.RUNNER_SANDBOX_ANNOTATIONS !== "0";

          // MESSAGE can quote what the sandbox wrote, so its lines go through the
          // same filter as the sandbox's own output.
          function fail(message) {
            const allowed = allowedCommands(annotations);
            console.error(String(message).split(/\r\n|\r|\n/).map((l) => neutralize(`runner-sandbox-exec: ${l}`, true, allowed)).join("\n"));
            process.exit(125);
          }

          const args = process.argv.slice(2);
          const ARGC = { "--action": 2, "--action-path": 3, "--stage": 3, "--seal": 1 };
          if (args.length === 0 || args.length !== (ARGC[args[0]] ?? (args[0].startsWith("--") ? -1 : 1))) fail(USAGE);
          const names = (process.env.RUNNER_SANDBOX_ENV ?? "").split(",").filter(Boolean);
          const env = {};
          for (const name of [...CONTEXT_ENV, ...names]) {
            if (process.env[name] !== undefined) env[name] = process.env[name];
          }
          // A step generated from an action has its env under fixed names, so the
          // action's own names never apply to this process; they come back here.
          const mapped = (process.env.RUNNER_SANDBOX_ENV_NAMES ?? "").split(",").filter(Boolean);
          mapped.forEach((name, i) => {
            const value = process.env[`RUNNER_SANDBOX_VAR_${i}`];
            if (value !== undefined) env[name] = value;
          });
          const id = crypto.randomBytes(16).toString("hex");
          let request;
          switch (args[0]) {
            case "--stage":
              request = { id, stage: { name: args[1], path: args[2] } };
              break;
            case "--seal":
              request = { id, seal: true };
              break;
            case "--action": {
              let spec;
              try {
                spec = JSON.parse(fs.readFileSync(args[1], "utf8"));
              } catch (e) {
                fail(`invalid action spec: ${e.message}`);
              }
              request = { id, action: { uses: spec.uses, entry: spec.entry, stateKey: spec.stateKey }, env };
              break;
            }
            case "--action-path":
              request = { id, script: fs.readFileSync(args[2], "utf8"), env, actionPath: args[1] };
              break;
            default:
              request = { id, script: fs.readFileSync(args[0], "utf8"), env };
          }
          request.annotations = annotations;
          // By absolute path: the step's own env: applies to this process.
          const r = spawnSync(SUDO, ["-n", RUN], { input: JSON.stringify(request), stdio: ["pipe", "inherit", "inherit"] });
          if (r.error) fail(`running ${RUN}: ${r.error.message}`);

          let result;
          try {
            result = JSON.parse(fs.readFileSync(`${RESULTS_DIR}/${id}.json`, "utf8"));
          } catch (e) {
            fail(`no result from the sandbox (exit ${r.status}): ${e.message}`);
          }
          if (result.error) fail(result.error);
          let outputs;
          try {
            outputs = parse(result.output, "GITHUB_OUTPUT");
          } catch (e) {
            fail(e.message);
          }
          if (outputs.length) fs.appendFileSync(process.env.GITHUB_OUTPUT, outputs.map(([k, v]) => format(k, v)).join(""));
          if (result.summary) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, result.summary);
          process.exit(result.status);
        RUNNER_SANDBOX_FILECMD_JS: |
          // The runner's commands, as far as the sandbox may use them.
          //
          // File commands (GITHUB_OUTPUT, GITHUB_ENV, GITHUB_STATE) are parsed and
          // written back here: `name=value` lines, and the heredoc form
          //
          //   name<<DELIMITER
          //   value, possibly
          //   several lines
          //   DELIMITER
          //
          // that @actions/core writes for every value. What the sandbox wrote is
          // untrusted: names are checked, and values are written back to the
          // runner's own files with a delimiter of the writer's choosing that the
          // value can't contain, so a value can never end early and start another
          // name. Installed as /usr/local/libexec/runner-sandbox-filecmd.cjs, where
          // exec.cjs and run.cjs require it; tests/runtime/ requires it directly.
          //
          // Workflow commands are lines of a step's output that the runner acts on:
          // `::name args::data` (after leading whitespace), and the legacy
          // `##[name args]data` anywhere in a line. A sandboxed step's output is
          // the sandbox's, so CommandFilter neutralizes every command in it except
          // the annotations linters report with (`warning`, `error`, `notice`),
          // `debug`, and `group`/`endgroup`, which fold the log: they only show
          // text. A step whose output isn't a linter's but an agent's, which a
          // prompt can steer, gets no annotations either (`annotations: false`):
          // they would put its text on the run and on pull requests' checks. The
          // others would set outputs or state
          // behind the file commands' checks (`set-output`, `save-state`), change
          // the runner's environment, PATH or problem matchers, mask text in later
          // steps' logs, or stop command processing for the steps after it.
          // Neutralized lines stay in the log, marked.
          "use strict";
          const crypto = require("node:crypto");
          const { StringDecoder } = require("node:string_decoder");

          const NAME_RE = /^[A-Za-z_][A-Za-z0-9_-]*$/;
          const HEREDOC_RE = /^([^=<\r\n]+)<<([^\r\n]+)$/;

          // Returns [[name, value], ...] from the text of a file command; throws on
          // anything else. WHAT names the file in messages.
          function parse(text, what) {
            const lines = text.split("\n");
            if (lines.at(-1) === "") lines.pop();
            const out = [];
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i].replace(/\r$/, "");
              if (line === "") continue;
              const heredoc = HEREDOC_RE.exec(line);
              let name;
              let value;
              if (heredoc) {
                name = heredoc[1];
                const delimiter = heredoc[2];
                const end = lines.findIndex((l, j) => j > i && l.replace(/\r$/, "") === delimiter);
                if (end < 0) throw new Error(`${what}: no closing ${JSON.stringify(delimiter.slice(0, 40))} for ${JSON.stringify(name.slice(0, 40))}`);
                value = lines.slice(i + 1, end).map((l) => l.replace(/\r$/, "")).join("\n");
                i = end;
              } else {
                const eq = line.indexOf("=");
                if (eq < 0) throw new Error(`${what}: refusing line ${JSON.stringify(line.slice(0, 80))}: neither name=value nor name<<DELIMITER`);
                name = line.slice(0, eq);
                value = line.slice(eq + 1);
              }
              if (!NAME_RE.test(name)) throw new Error(`${what}: invalid name ${JSON.stringify(name.slice(0, 80))}`);
              if (value.includes("\0")) throw new Error(`${what}: ${name} has a NUL byte`);
              out.push([name, value]);
            }
            return out;
          }

          // The text that sets NAME to VALUE in a file command, safe for any value.
          function format(name, value) {
            if (!NAME_RE.test(name)) throw new Error(`invalid name ${JSON.stringify(name)}`);
            if (!value.includes("\n") && !value.includes("\r")) return `${name}=${value}\n`;
            let delimiter;
            do delimiter = `ghadelimiter_${crypto.randomUUID()}`; while (value.includes(delimiter));
            return `${name}<<${delimiter}\n${value}\n${delimiter}\n`;
          }

          const TEXT_COMMANDS = ["debug", "group", "endgroup"];
          const ANNOTATIONS = ["warning", "error", "notice"];
          const ALLOWED_COMMANDS = new Set([...ANNOTATIONS, ...TEXT_COMMANDS]);
          const ALLOWED_NO_ANNOTATIONS = new Set(TEXT_COMMANDS);
          // The commands a step's output may use.
          const allowedCommands = (annotations) => (annotations ? ALLOWED_COMMANDS : ALLOWED_NO_ANNOTATIONS);
          const LEGACY_PREFIX = "##[";
          const NEUTRALIZED_LEGACY = "## [";
          const MARK = "[sandbox] ";
          // Longest stretch of one line held before it is passed on in pieces.
          const MAX_HELD = 64 * 1024;

          // LINE, one line of a sandboxed step's output, with its commands
          // neutralized. AT_START is false for the rest of a line whose start was
          // already passed on. ALLOWED is the set of commands left as they are.
          function neutralize(line, atStart = true, allowed = ALLOWED_COMMANDS) {
            const out = line.replaceAll(LEGACY_PREFIX, NEUTRALIZED_LEGACY);
            if (!atStart) return out;
            // The runner trims what .NET calls whitespace, which includes U+0085.
            const m = /^([\s\u0085]*)::([^\s\u0085:]*)/.exec(out);
            if (!m || allowed.has(m[2].toLowerCase())) return out;
            return `${m[1]}${MARK}${out.slice(m[1].length)}`;
          }

          // Filters a stream of a sandboxed step's output: push() chunks as they
          // come, and end() at the end; both return what to pass on. Lines end
          // where the runner's reader ends them, at \n, \r or \r\n. ANNOTATIONS
          // false neutralizes annotations too.
          class CommandFilter {
            constructor({ annotations = true } = {}) {
              this.allowed = allowedCommands(annotations);
              this.decoder = new StringDecoder("utf8");
              this.held = "";
              this.atStart = true;
            }

            push(chunk) {
              this.held += typeof chunk === "string" ? chunk : this.decoder.write(chunk);
              let out = "";
              for (;;) {
                const m = /\r\n|\r|\n/.exec(this.held);
                // A \r at the end may be the start of \r\n.
                if (!m || (m[0] === "\r" && m.index === this.held.length - 1)) break;
                out += neutralize(this.held.slice(0, m.index), this.atStart, this.allowed) + m[0];
                this.held = this.held.slice(m.index + m[0].length);
                this.atStart = true;
              }
              if (this.held.length > MAX_HELD) {
                // Keep the last two characters: they may begin a "##[".
                const keep = this.held.slice(-2);
                out += neutralize(this.held.slice(0, -2), this.atStart, this.allowed);
                this.held = keep;
                this.atStart = false;
              }
              return out;
            }

            end() {
              const rest = this.held + this.decoder.end();
              this.held = "";
              return rest === "" ? "" : neutralize(rest, this.atStart, this.allowed);
            }
          }

          module.exports = { parse, format, NAME_RE, neutralize, allowedCommands, CommandFilter };
        RUNNER_SANDBOX_HANDOFF_JS: |
          // The workspace hand-off: what the enter step copies from the runner's
          // workspace into the sandbox's. install.cjs loads it (the compiler passes
          // it as RUNNER_SANDBOX_HANDOFF_JS) and runs it as root; tests/runtime/
          // requires it directly.
          //
          // The job's `handoff.workspace` picks what is copied:
          //
          //   tracked  the files git tracks (`git ls-files`), plus handoff.include
          //   all      the whole workspace
          //   none     nothing: the sandbox starts in an empty directory
          //
          // Nothing here follows a symlink: a path that goes through one is refused,
          // and a symlink inside the copied tree is copied as a symlink, which the
          // sandbox then resolves as its own user. Special files are refused. The
          // copy is refused too if it holds credentials a setup step left behind,
          // such as checkout's token with persist-credentials, or an .npmrc token.
          // Files exactly as git tracks them aren't scanned: whatever they hold was
          // committed, not left behind by the runner.
          "use strict";
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const HANDOFF_MODES = ["tracked", "all", "none"];

          // Files that hold credentials: which paths, and patterns whose first group
          // is the credential. A value that only refers to an environment variable
          // (an .npmrc's `_authToken=${NPM_TOKEN}`) is not one.
          const CREDENTIAL_FILES = [
            // checkout's persist-credentials (older versions write it here), or a
            // token in a remote URL, for the repository and its submodules.
            { path: /(^|\/)\.git\/(modules\/.+\/)?config$/, re: [/^\s*extraheader\s*=\s*(.+)$/gim, /:\/\/[^/\s:@]+:([^/\s@]+)@/g] },
            { path: /(^|\/)\.git-credentials$/, re: [/^\s*(\S.*?)\s*$/gm] },
            { path: /(^|\/)\.netrc$/, re: [/\bpassword\s+(\S+)/g] },
            { path: /(^|\/)\.npmrc$/, re: [/(?:_authToken|_auth|_password)\s*=\s*(.+)$/gm] },
            { path: /(^|\/)\.yarnrc\.yml$/, re: [/(?:npmAuthToken|npmAuthIdent)\s*:\s*(.+)$/gm] },
            { path: /(^|\/)\.pypirc$/, re: [/^\s*password\s*[=:]\s*(.+)$/gm] },
            { path: /(^|\/)\.docker\/config\.json$/, re: [/"(?:auth|identitytoken|registrytoken)"\s*:\s*"([^"]+)"/g] },
            { path: /(^|\/)\.aws\/credentials$/, re: [/aws_secret_access_key\s*=\s*(.+)$/gm] },
            // gh's login, cargo's registry token.
            { path: /(^|\/)gh\/hosts\.yml$/, re: [/oauth_token\s*:\s*(.+)$/gm] },
            { path: /(^|\/)\.cargo\/credentials(\.toml)?$/, re: [/^\s*token\s*=\s*(.+)$/gm] },
            // google-github-actions/auth writes these into the workspace.
            { path: /(^|\/)gha-creds-[^/]*\.json$/, re: [/^([\s\S]+)$/g] },
          ];
          // Tokens GitHub issues, in any file.
          const GITHUB_TOKEN_RE = /\b(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})\b/;
          const ENV_REFERENCE_RE = /^\s*["']?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?["']?\s*$/;

          // Throws if DATA, the content of the workspace file REL, holds credentials.
          function checkCredentials(data, rel) {
            const text = data.toString("utf8");
            const refuse = (what) => {
              throw new Error(`${rel} holds ${what}; refusing to hand it to the sandbox (for checkout, set persist-credentials: false)`);
            };
            if (GITHUB_TOKEN_RE.test(text)) refuse("a GitHub token");
            for (const c of CREDENTIAL_FILES) {
              if (!c.path.test(rel)) continue;
              for (const re of c.re) {
                for (const m of text.matchAll(re)) {
                  if (!ENV_REFERENCE_RE.test(m[1])) refuse("credentials");
                }
              }
            }
          }

          // The git object id of DATA as a blob, in the hash of OID (SHA-1 or SHA-256).
          function blobId(data, oid) {
            const hash = crypto.createHash(oid.length === 64 ? "sha256" : "sha1");
            return hash.update(`blob ${data.length}\0`).update(data).digest("hex");
          }

          // {path: oid} from the NUL-separated output of `git ls-files -z -s`.
          function parseIndex(text) {
            const index = new Map();
            for (const entry of text.split("\0").filter(Boolean)) {
              const m = /^\d+ ([0-9a-f]{40}|[0-9a-f]{64}) \d+\t(.+)$/s.exec(entry);
              if (!m) throw new Error(`unexpected git ls-files entry ${JSON.stringify(entry.slice(0, 80))}`);
              index.set(m[2], m[1]);
            }
            return index;
          }

          // A relative path within the workspace: no leading /, no . or .. component.
          function checkRelative(rel) {
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === "" || c === "." || c === "..")) {
              throw new Error(`invalid workspace path ${JSON.stringify(rel)}`);
            }
          }

          // Whether ROOT/REL exists; throws if it goes through a symlink before its
          // last component.
          function existsNoSymlinkAbove(root, rel) {
            let p = root;
            for (const part of rel.split("/")) {
              p = path.join(p, part);
              const st = fs.lstatSync(p, { throwIfNoEntry: false });
              if (!st) return false;
              if (p === path.join(root, rel)) return true;
              if (st.isSymbolicLink()) throw new Error(`${rel} goes through the symlink ${path.relative(root, p)}`);
              if (!st.isDirectory()) throw new Error(`${rel}: ${path.relative(root, p)} is not a directory`);
            }
            return true;
          }

          // Copies SRC (REL in the workspace) to DEST, owned by OWNER {uid, gid},
          // keeping modes and times, copying symlinks as symlinks, refusing special
          // files and credentials in files that differ from INDEX.
          function copyEntry(src, dest, rel, owner, index) {
            const st = fs.lstatSync(src);
            if (st.isSymbolicLink()) {
              fs.symlinkSync(fs.readlinkSync(src), dest);
              fs.lchownSync(dest, owner.uid, owner.gid);
              return;
            }
            if (st.isDirectory()) {
              fs.mkdirSync(dest, { mode: 0o700 });
              for (const entry of fs.readdirSync(src).sort()) {
                copyEntry(path.join(src, entry), path.join(dest, entry), path.join(rel, entry), owner, index);
              }
            } else if (st.isFile()) {
              const data = fs.readFileSync(src);
              const oid = index.get(rel);
              if (!oid || blobId(data, oid) !== oid) checkCredentials(data, rel);
              fs.writeFileSync(dest, data, { mode: 0o600, flag: "wx" });
            } else {
              throw new Error(`${rel} is not a regular file, directory or symlink; refusing to hand it to the sandbox`);
            }
            fs.chownSync(dest, owner.uid, owner.gid);
            fs.chmodSync(dest, st.mode & 0o7777 & ~0o6000);
            fs.utimesSync(dest, st.atime, st.mtime);
          }

          // Creates the parent directories of DEST_ROOT/REL that don't exist yet,
          // like their counterparts in SRC_ROOT.
          function makeParents(srcRoot, destRoot, rel, owner) {
            const parts = rel.split("/").slice(0, -1);
            for (let i = 1; i <= parts.length; i++) {
              const sub = parts.slice(0, i).join("/");
              const dest = path.join(destRoot, sub);
              if (fs.existsSync(dest)) continue;
              const st = fs.lstatSync(path.join(srcRoot, sub));
              fs.mkdirSync(dest, { mode: st.mode & 0o777 });
              fs.chownSync(dest, owner.uid, owner.gid);
            }
          }

          // The workspace paths to copy for MODE, relative to the workspace, or null
          // for all of it, given the INDEX of what git tracks.
          function handoffPaths(mode, include, index) {
            if (!HANDOFF_MODES.includes(mode)) throw new Error(`invalid handoff mode ${JSON.stringify(mode)}`);
            if (mode === "none") return [];
            if (mode === "all") return null;
            const all = new Set([...index.keys(), ...include]);
            // A path below another one in the list is copied with it (an included
            // directory, or a submodule, which git lists as one entry).
            const below = (p) => {
              const parts = p.split("/");
              return parts.slice(1).some((_, i) => all.has(parts.slice(0, i + 1).join("/")));
            };
            return [...all].filter((p) => !below(p)).sort();
          }

          // Hands WORKSPACE over to DEST, owned by OWNER. LIST_TRACKED returns the
          // output of `git ls-files -z -s` (install.cjs runs it as the runner user,
          // not root), and throws if the workspace isn't a git checkout, which only
          // 'tracked needs. Returns the number of top-level entries copied.
          function handoff({ workspace, dest, mode, include = [], owner, listTracked }) {
            for (const rel of include) checkRelative(rel);
            let index = new Map();
            if (mode !== "none") {
              try {
                index = parseIndex(listTracked());
              } catch (e) {
                if (mode === "tracked") throw e;
              }
            }
            const paths = handoffPaths(mode, include, index);
            fs.mkdirSync(dest, { recursive: true, mode: 0o755 });
            fs.chownSync(dest, owner.uid, owner.gid);
            const rels = paths ?? fs.readdirSync(workspace).sort();
            for (const rel of rels) {
              checkRelative(rel);
              const src = path.join(workspace, rel);
              if (!existsNoSymlinkAbove(workspace, rel)) {
                // A tracked file the setup steps deleted is simply not there.
                if (include.includes(rel)) throw new Error(`handoff.include path ${rel} does not exist in the workspace`);
                continue;
              }
              makeParents(workspace, dest, rel, owner);
              copyEntry(src, path.join(dest, rel), rel, owner, index);
            }
            return rels.length;
          }

          module.exports = { handoff, handoffPaths, checkCredentials, HANDOFF_MODES };
        RUNNER_SANDBOX_LAUNCH_JS: |
          // Starts a sandboxed step's program as the sandbox user, with the
          // environment runner-sandbox-run wrote to a file: values can span several
          // lines and input names have dashes (INPUT_NODE-VERSION), which run0's
          // --setenv can't carry. Installed by the enter step as
          // /usr/local/libexec/runner-sandbox-launch; for an action, PROGRAM is this
          // same (root-owned) node and ARGS the action's entry point, which is how
          // the runner starts it (`node <entry>`).
          //
          //   runner-sandbox-launch ENV_JSON PROGRAM [ARGS...]
          "use strict";
          const fs = require("node:fs");
          const os = require("node:os");
          const { spawnSync } = require("node:child_process");

          const [envFile, program, ...args] = process.argv.slice(2);
          if (!envFile || !program) {
            console.error("usage: runner-sandbox-launch ENV_JSON PROGRAM [ARGS...]");
            process.exit(125);
          }
          const env = { ...process.env, ...JSON.parse(fs.readFileSync(envFile, "utf8")) };
          const r = spawnSync(program === "node" ? process.execPath : program, args, { env, stdio: "inherit" });
          if (r.error) {
            console.error(`runner-sandbox-launch: ${r.error.message}`);
            process.exit(125);
          }
          process.exit(r.status ?? 128 + (os.constants.signals[r.signal] ?? 0));
        RUNNER_SANDBOX_RUN_JS: |
          // Root side of a sandboxed step: runner-sandbox-exec pipes a request
          // ({id, script, env}) to this program through `sudo -n`, the one command the
          // runner user may still run as root once the job has entered the sandbox.
          // It runs the script as the sandbox user with run0, in a login session of
          // its own and with a fixed environment, then hands back what the step wrote to its
          // GITHUB_OUTPUT and GITHUB_STEP_SUMMARY. Nothing here trusts the request: its
          // fields are validated, and the files the sandbox wrote are read without
          // following symlinks.
          //
          // A request {id, action: {uses, entry, stateKey}, env} runs a pinned
          // JavaScript action the enter step fetched (runtime/fetch-actions.cjs):
          // its entry point (`main` or `post`) runs as the sandbox user, with its
          // inputs from env. A request {id, script, env, actionPath} is a `run:`
          // step of a composite action, with GITHUB_ACTION_PATH set.
          //
          // Every step gets its own GITHUB_OUTPUT, GITHUB_ENV, GITHUB_PATH,
          // GITHUB_STATE and GITHUB_STEP_SUMMARY files, owned by the sandbox.
          // Outputs and the summary go back to the runner side; environment and
          // PATH changes apply to later sandboxed steps only, never to the runner,
          // and are kept in ENV_STORE; state goes to the action's post step.
          //
          // A request {id, stage: {name, path}} instead copies PATH from the
          // sandbox's workspace to STAGED_DIR/NAME, for a generated stage step:
          // publish steps run as runner, and actions like upload-artifact follow
          // symlinks, so they must never read a path the sandbox controls.
          //
          // A request {id, seal: true}, from the generated step after the last
          // sandboxed step, stops the sandbox's processes for good and makes its
          // files unreadable to runner; every request after it is refused.
          "use strict";
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawn, spawnSync } = require("node:child_process");

          const CONFIG = JSON.parse(fs.readFileSync("/etc/runner-sandbox/config.json", "utf8"));
          const STEPS_DIR = "/run/runner-sandbox/steps";
          const RESULTS_DIR = "/run/runner-sandbox/results";
          const STAGED_DIR = "/run/runner-sandbox/staged";
          const SEALED = "/run/runner-sandbox/sealed";
          const ENV_STORE = "/run/runner-sandbox/env.json";
          const STATE_DIR = "/run/runner-sandbox/state";
          // Where the enter step fetched the actions, root-owned.
          const ACTIONS_DIR = "/opt/runner-sandbox/actions";
          const LAUNCHER = "/usr/local/libexec/runner-sandbox-launch";
          const { parse: parseFileCommand, CommandFilter } = require("/usr/local/libexec/runner-sandbox-filecmd.cjs");
          // owner/repo[/path]@<40 hex>, as the compiler pins them.
          const USES_RE = /^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)((?:\/[A-Za-z0-9_.-]+)*)@([0-9a-f]{40})$/;
          const RUNNER_ARCH = { x64: "X64", arm64: "ARM64" }[process.arch] ?? process.arch.toUpperCase();
          // Filesystems not to look for world-writable directories on, where the
          // sandbox can leave files that outlive its steps (its /tmp and /var/tmp
          // are private to each step): kernel interfaces, not storage.
          const KERNEL_FSTYPES = new Set([
            "proc", "sysfs", "cgroup", "cgroup2", "devpts", "securityfs", "debugfs", "tracefs",
            "bpf", "pstore", "configfs", "fusectl", "binfmt_misc", "efivarfs", "autofs", "nsfs",
          ]);
          const MAX_FILE = 1 << 20;
          const SANDBOX_PATH = "/usr/local/bin:/usr/bin:/bin";
          const SUDO_VARS = ["SUDO_USER", "SUDO_UID", "SUDO_GID", "SUDO_HOME"];
          // Variables the request may not set: the runner's credentials and anything
          // that changes how the sandbox's own programs start.
          const DENIED_ENV = /^(ACTIONS_|GITHUB_TOKEN$|GITHUB_ENV$|GITHUB_PATH$|GITHUB_OUTPUT$|GITHUB_STATE$|GITHUB_STEP_SUMMARY$|RUNNER_|LD_|BASH_ENV$|ENV$|NODE_|PATH$|HOME$|USER$|LOGNAME$|SHELL$)/;

          function fail(message) {
            console.error(`runner-sandbox-run: ${message}`);
            process.exit(125);
          }

          // Reads a file the sandbox user wrote, refusing symlinks and oversized files.
          function readSandboxFile(file) {
            let fd;
            try {
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
            } catch (e) {
              if (e.code === "ENOENT") return "";
              throw new Error(`${path.basename(file)}: ${e.code}`);
            }
            try {
              const st = fs.fstatSync(fd);
              if (!st.isFile()) throw new Error(`${path.basename(file)} is not a regular file`);
              if (st.size > MAX_FILE) throw new Error(`${path.basename(file)} is larger than ${MAX_FILE} bytes`);
              return fs.readFileSync(fd, "utf8");
            } finally {
              fs.closeSync(fd);
            }
          }

          // Copies SRC to DEST as root:root, 0644 files in 0755 directories,
          // refusing symlinks and special files anywhere below SRC.
          function copyTree(src, dest) {
            const st = fs.lstatSync(src);
            if (st.isDirectory()) {
              fs.mkdirSync(dest, { mode: 0o755 });
              for (const entry of fs.readdirSync(src).sort()) copyTree(path.join(src, entry), path.join(dest, entry));
            } else if (st.isFile()) {
              fs.writeFileSync(dest, fs.readFileSync(src), { mode: 0o644, flag: "wx" });
            } else {
              throw new Error(`${path.relative(CONFIG.workdir, src)} is a symlink or special file`);
            }
          }

          // Handles a stage request; the sandbox user has no process left, so
          // nothing changes the tree while it is copied.
          function stage({ name, path: rel }) {
            if (!/^[A-Za-z0-9_-]+$/.test(name ?? "")) throw new Error(`invalid stage name ${JSON.stringify(name)}`);
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === ".." || c === "")) {
              throw new Error(`invalid stage path ${JSON.stringify(rel)}`);
            }
            const src = path.join(CONFIG.workdir, rel);
            let real;
            try {
              real = fs.realpathSync(src);
            } catch (e) {
              throw new Error(`${rel}: ${e.code}`);
            }
            if (real !== src) throw new Error(`${rel} goes through a symlink`);
            const dest = path.join(STAGED_DIR, name);
            fs.rmSync(dest, { recursive: true, force: true });
            fs.mkdirSync(dest, { mode: 0o755 });
            try {
              copyTree(src, path.join(dest, path.basename(src)));
            } catch (e) {
              fs.rmSync(dest, { recursive: true, force: true });
              throw e;
            }
          }

          let req;
          try {
            req = JSON.parse(fs.readFileSync(0, "utf8"));
          } catch (e) {
            fail(`invalid request: ${e.message}`);
          }
          if (!/^[0-9a-f]{32}$/.test(req.id ?? "")) fail("invalid step id");
          if (req.annotations !== undefined && typeof req.annotations !== "boolean") fail("invalid annotations");
          if (typeof req.script !== "string" && typeof req.action !== "object" && typeof req.stage !== "object" && req.seal !== true) fail("missing script");
          const env = req.env ?? {};
          // The environment reaches the step through a file (see LAUNCHER), so
          // values may span lines, and names may have dashes (INPUT_NODE-VERSION).
          const ENV_NAME_RE = /^[A-Za-z_][A-Za-z0-9_-]*$/;
          for (const [k, v] of Object.entries(env)) {
            if (!ENV_NAME_RE.test(k)) fail(`invalid variable name ${JSON.stringify(k)}`);
            if (DENIED_ENV.test(k)) fail(`${k} cannot be passed into the sandbox`);
            if (typeof v !== "string" || v.includes("\0")) fail(`${k}: values must be strings without NUL`);
          }

          // The directory of a fetched action, from a `uses` the request names.
          function actionDir(uses) {
            const m = USES_RE.exec(uses ?? "");
            if (!m) throw new Error(`invalid action ${JSON.stringify(uses)}`);
            const [, owner, repo, sub, sha] = m;
            if (sub.split("/").some((c) => c === "." || c === "..")) throw new Error(`invalid action path in ${uses}`);
            const dir = path.join(ACTIONS_DIR, owner, repo, sha, sub);
            if (!fs.statSync(dir, { throwIfNoEntry: false })?.isDirectory()) throw new Error(`${uses} was not fetched by the enter step`);
            return { dir, repository: `${owner}/${repo}`, ref: sha };
          }

          // A file of an action by its path in action.yml, which must stay inside it.
          function actionFile(dir, rel) {
            if (typeof rel !== "string" || rel === "" || path.isAbsolute(rel) || rel.split("/").some((c) => c === ".." || c === "")) {
              throw new Error(`invalid entry point ${JSON.stringify(rel)}`);
            }
            const file = fs.realpathSync(path.join(dir, rel));
            if (!file.startsWith(`${fs.realpathSync(dir)}/`)) throw new Error(`entry point ${rel} leaves the action`);
            return file;
          }

          const STATE_KEY_RE = /^[A-Za-z0-9_-]{1,100}$/;

          function readEnvStore() {
            return fs.existsSync(ENV_STORE) ? JSON.parse(fs.readFileSync(ENV_STORE, "utf8")) : { env: {}, path: [] };
          }

          // Applies what a step wrote to GITHUB_ENV and GITHUB_PATH to the store
          // that later sandboxed steps start from. The values are the sandbox's own
          // business, but the names the wrapper sets itself are refused.
          function updateEnvStore(envText, pathText) {
            const store = readEnvStore();
            for (const [k, v] of parseFileCommand(envText, "GITHUB_ENV")) {
              if (DENIED_ENV.test(k)) throw new Error(`GITHUB_ENV: ${k} cannot be set in the sandbox`);
              store.env[k] = v;
            }
            for (const line of pathText.split("\n").map((l) => l.replace(/\r$/, "")).filter(Boolean)) {
              if (!path.isAbsolute(line) || line.includes(":")) throw new Error(`GITHUB_PATH: refusing ${JSON.stringify(line.slice(0, 80))}: must be an absolute path without ':'`);
              store.path = [line, ...store.path.filter((p) => p !== line)];
            }
            fs.writeFileSync(`${ENV_STORE}.tmp`, JSON.stringify(store), { mode: 0o600 });
            fs.renameSync(`${ENV_STORE}.tmp`, ENV_STORE);
          }

          // pam_systemd moves each step into a session scope, which outlives the
          // service when the step leaves a process behind, and the user's systemd
          // manager can run more. Stopping the user's slice ends all of them, and
          // systemctl waits until they are gone. It runs before each step too, for a
          // step whose run.cjs was killed (a timeout, a cancel) before it got to
          // stop its own; cron, at and lingering are denied to the sandbox user, so
          // nothing can start its processes outside a step.
          function stopSandboxProcesses() {
            const r = spawnSync("systemctl", ["stop", `user-${CONFIG.uid}.slice`], { stdio: ["ignore", "inherit", "inherit"] });
            return r.status === 0 ? null : `could not stop the sandbox user's processes (${r.error ?? `exit ${r.status}`})`;
          }

          // The ids the sandbox's files can have: its own, and the subordinate ids
          // rootless podman maps its containers to (`podman unshare chown 1:1 f`
          // makes a file owned by one of them).
          function sandboxIds(file, id) {
            const ranges = [[id, 1]];
            const text = fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "";
            for (const line of text.split("\n")) {
              const [owner, start, count] = line.split(":");
              if (owner === CONFIG.user || owner === String(id)) ranges.push([Number(start), Number(count)]);
            }
            return (n) => ranges.some(([start, count]) => n >= start && n < start + count);
          }

          // World-writable directories (sticky or not) on every mounted filesystem
          // but the kernel's own. Throws if one can't be searched: a seal that
          // misses a directory would leave its files to runner.
          function worldWritableDirs() {
            const mounts = fs.readFileSync("/proc/self/mounts", "utf8").split("\n")
              .map((l) => l.split(" "))
              .filter((f) => f.length > 2 && !KERNEL_FSTYPES.has(f[2]))
              .map((f) => f[1].replace(/\\040/g, " "));
            const dirs = new Set();
            for (const top of new Set(["/", ...mounts])) {
              const r = spawnSync("find", [top, "-xdev", "-type", "d", "-perm", "-0002", "-print0"], { encoding: "utf8", maxBuffer: 1 << 28, stdio: ["ignore", "pipe", "pipe"] });
              // Entries that vanish during the search (a process's /run files) are
              // not a reason to fail; anything else, or a truncated output, is.
              const problems = (r.stderr ?? "").split("\n").filter((l) => l && !l.endsWith("No such file or directory"));
              if (r.error || r.signal || (r.status !== 0 && problems.length)) {
                throw new Error(`searching ${top} for world-writable directories failed (${r.error?.message ?? r.signal ?? problems.join("; ").slice(0, 300)})`);
              }
              for (const d of r.stdout.split("\0").filter(Boolean)) dirs.add(d);
            }
            return [...dirs];
          }

          // Stops the sandbox for good: its processes, and runner's access to
          // whatever it left behind, so publish steps can only read staged outputs.
          function seal() {
            fs.writeFileSync(SEALED, "", { mode: 0o644 });
            // What the sandbox set for its own later steps, and its actions' state.
            fs.rmSync(ENV_STORE, { force: true });
            fs.rmSync(STATE_DIR, { recursive: true, force: true });
            // /var/lib/runner-sandbox (root's) holds the workspace; the home is the
            // sandbox user's.
            for (const dir of [path.dirname(CONFIG.workdir), CONFIG.home]) fs.chmodSync(dir, 0o700);
            const isUid = sandboxIds("/etc/subuid", CONFIG.uid);
            const isGid = sandboxIds("/etc/subgid", CONFIG.gid);
            const removed = [];
            for (const dir of worldWritableDirs()) {
              for (const entry of fs.readdirSync(dir)) {
                const p = path.join(dir, entry);
                const st = fs.lstatSync(p, { throwIfNoEntry: false });
                if (st && (isUid(st.uid) || isGid(st.gid))) {
                  fs.rmSync(p, { recursive: true, force: true });
                  removed.push(p);
                }
              }
            }
            console.log(`Sealed the sandbox${removed.length ? `; removed what it left in ${removed.join(", ")}` : ""}`);
          }

          function writeResult(result) {
            fs.writeFileSync(path.join(RESULTS_DIR, `${req.id}.json`), JSON.stringify(result), { mode: 0o644, flag: "wx" });
          }

          const user = CONFIG.user;
          if (fs.existsSync(SEALED)) {
            writeResult({ status: 125, error: "the sandbox is sealed: no sandboxed step can run after the seal step" });
            process.exit(125);
          }
          const stopError = stopSandboxProcesses();
          if (stopError) fail(stopError);
          if (req.stage || req.seal) {
            let result = { status: 0, output: "", summary: "" };
            try {
              if (req.stage) stage(req.stage);
              else seal();
            } catch (e) {
              result = { status: 1, error: `${req.stage ? "stage" : "seal"}: ${e.message}` };
            }
            writeResult(result);
            process.exit(result.status);
          }
          const stepDir = path.join(STEPS_DIR, req.id);
          const outDir = path.join(stepDir, "out");
          fs.mkdirSync(stepDir, { mode: 0o755 }); // fails if the id was used before
          fs.mkdirSync(outDir, { mode: 0o700 });
          fs.chownSync(outDir, CONFIG.uid, CONFIG.gid);
          const FILES = { output: "GITHUB_OUTPUT", env: "GITHUB_ENV", path: "GITHUB_PATH", state: "GITHUB_STATE", summary: "GITHUB_STEP_SUMMARY" };
          // @actions/core refuses to write to a file command that doesn't exist, as
          // the runner always creates them.
          for (const f of Object.keys(FILES)) {
            const file = path.join(outDir, f);
            fs.writeFileSync(file, "", { mode: 0o600, flag: "wx" });
            fs.chownSync(file, CONFIG.uid, CONFIG.gid);
          }

          let action = null;
          let stateKey = null;
          try {
            if (req.action) {
              action = actionDir(req.action.uses);
              action.entry = actionFile(action.dir, req.action.entry);
              stateKey = req.action.stateKey ?? null;
              if (stateKey !== null && !STATE_KEY_RE.test(stateKey)) throw new Error(`invalid state key ${JSON.stringify(stateKey)}`);
            } else if (req.actionPath !== undefined) {
              action = actionDir(req.actionPath);
            }
          } catch (e) {
            fs.rmSync(stepDir, { recursive: true, force: true });
            writeResult({ status: 125, error: e.message });
            process.exit(125);
          }

          const store = readEnvStore();
          const state = stateKey && fs.existsSync(path.join(STATE_DIR, `${stateKey}.json`))
            ? JSON.parse(fs.readFileSync(path.join(STATE_DIR, `${stateKey}.json`), "utf8"))
            : {};
          const vars = {
            ...store.env,
            ...Object.fromEntries(Object.entries(state).map(([k, v]) => [`STATE_${k}`, v])),
            ...env,
            LANG: "C.UTF-8",
            PATH: [...store.path, SANDBOX_PATH].join(":"),
            GITHUB_WORKSPACE: CONFIG.workdir,
            RUNNER_TEMP: CONFIG.tempdir,
            RUNNER_TOOL_CACHE: CONFIG.toolcache,
            RUNNER_OS: "Linux",
            RUNNER_ARCH,
            ...(action ? { GITHUB_ACTION_PATH: action.dir, GITHUB_ACTION_REPOSITORY: action.repository, GITHUB_ACTION_REF: action.ref } : {}),
            ...Object.fromEntries(Object.entries(FILES).map(([f, name]) => [name, path.join(outDir, f)])),
          };
          const envFile = path.join(stepDir, "env.json");
          // Readable by the sandbox, which starts with it, and not by runner.
          fs.writeFileSync(envFile, JSON.stringify(vars), { mode: 0o640 });
          fs.chownSync(envFile, 0, CONFIG.gid);
          let command;
          if (req.action) {
            command = [LAUNCHER, envFile, "node", action.entry];
          } else {
            fs.writeFileSync(path.join(stepDir, "script.sh"), req.script, { mode: 0o644 });
            command = [LAUNCHER, envFile, "/bin/bash", "--noprofile", "--norc", "-e", "-o", "pipefail", path.join(stepDir, "script.sh")];
          }
          // run0 starts the script as a transient service through its own PAM stack
          // (no pam_env), so pam_systemd gives it a logind session like an SSH login
          // gets: XDG_RUNTIME_DIR and the user's systemd manager, which rootless
          // podman needs. It sets HOME, USER, LOGNAME and SHELL for the sandbox user
          // itself. It also sets SUDO_USER and friends as sudo would, which tools
          // take to mean they run under sudo, and --setenv can't unset them, hence
          // the env -u. Unlike systemd-run --collect, run0 would leave a failed unit
          // behind for every step that fails, so collect those too.
          const argv = [
            "--pipe", "--no-ask-password", "--shell-prompt-prefix=", `--user=${user}`, `--chdir=${CONFIG.workdir}`,
            "--property=CollectMode=inactive-or-failed",
            // The sandbox gets its own /tmp, so it can't leave files there for the
            // runner's later steps; the runner's home is hidden outright.
            "--property=PrivateTmp=yes", `--property=InaccessiblePaths=-${CONFIG.runnerHome}`,
            `--setenv=LANG=${vars.LANG}`, `--setenv=PATH=${vars.PATH}`,
            "--", "env", ...SUDO_VARS.flatMap((v) => ["-u", v]), "--",
            ...command,
          ];
          // Runs run0 with ARGV, passing on its output through a CommandFilter per
          // stream, and resolves to its exit status. run0 hands stdio to PID 1 over
          // D-Bus, which accepts pipes but not every file type, so its stdin is an
          // empty pipe rather than /dev/null.
          function runFiltered(args) {
            return new Promise((resolve) => {
              const child = spawn("run0", args, { stdio: ["pipe", "pipe", "pipe"] });
              child.stdin.end();
              for (const [from, to] of [[child.stdout, process.stdout], [child.stderr, process.stderr]]) {
                const filter = new CommandFilter({ annotations: req.annotations !== false });
                from.on("data", (chunk) => to.write(filter.push(chunk)));
                from.on("end", () => to.write(filter.end()));
              }
              child.on("error", (e) => {
                console.error(`runner-sandbox-run: run0: ${e.message}`);
                resolve(125);
              });
              child.on("close", (code) => resolve(code ?? 125));
            });
          }

          (async () => {
            const status = await runFiltered(argv);

            // Every process of the step is gone after this, so none can touch the
            // files read below.
            const stopAfter = stopSandboxProcesses();
            let result;
            try {
              if (stopAfter) throw new Error(stopAfter);
              const read = Object.fromEntries(Object.keys(FILES).map((f) => [f, readSandboxFile(path.join(outDir, f))]));
              updateEnvStore(read.env, read.path);
              if (stateKey !== null) {
                const saved = Object.fromEntries(parseFileCommand(read.state, "GITHUB_STATE"));
                fs.mkdirSync(STATE_DIR, { recursive: true, mode: 0o700 });
                fs.writeFileSync(path.join(STATE_DIR, `${stateKey}.json`), JSON.stringify({ ...state, ...saved }), { mode: 0o600 });
              }
              result = { status, output: read.output, summary: read.summary };
            } catch (e) {
              result = { status: 125, error: e.message };
            }
            fs.rmSync(stepDir, { recursive: true, force: true });
            writeResult(result);
            process.exitCode = result.status;
          })();
      name: Enter the sandbox (generated)
      run: |
        const CONFIG = {
          "handoff": {
            "include": [],
            "workspace": "tracked"
          },
          "lockRunnerSudo": true,
          "user": "runner-sandbox",
          "workspace": "${{ github.workspace }}"
        };
        // The compiler-generated "enter the sandbox" step, run as root (`sudo node`)
        // right after the job's runner_steps. The compiler prepends
        // `const CONFIG = {...};` to this file and passes the two halves of the step
        // wrapper as RUNNER_SANDBOX_EXEC_JS and RUNNER_SANDBOX_RUN_JS, the
        // workspace hand-off (handoff.cjs) as RUNNER_SANDBOX_HANDOFF_JS, and the
        // file command parser and step launcher they use as
        // RUNNER_SANDBOX_FILECMD_JS and RUNNER_SANDBOX_LAUNCH_JS.
        //
        // It creates the sandbox user, hands it the workspace, installs
        // the two halves of the step wrapper, and (with CONFIG.lockRunnerSudo) takes
        // root away from the runner user, whose only remaining sudo rule is the
        // wrapper. From here on, the job's run steps execute as the sandbox user.
        const fs = require("node:fs");
        const path = require("node:path");
        const { spawnSync } = require("node:child_process");

        const CONFIG_DIR = "/etc/runner-sandbox";
        const EXEC = "/usr/local/bin/runner-sandbox-exec";
        const RUN = "/usr/local/libexec/runner-sandbox-run";
        const SUDOERS = "/etc/sudoers.d/zz-runner-sandbox";
        const WORKDIR = "/var/lib/runner-sandbox/work";
        // The sandbox's RUNNER_TEMP and RUNNER_TOOL_CACHE, for the actions it runs.
        const TEMPDIR = "/var/lib/runner-sandbox/temp";
        const TOOLCACHE = "/var/lib/runner-sandbox/toolcache";
        const FILECMD = "/usr/local/libexec/runner-sandbox-filecmd.cjs";
        const LAUNCHER = "/usr/local/libexec/runner-sandbox-launch";
        const DOCKER_UNITS = ["docker.socket", "docker.service", "containerd.service"];

        function run(cmd, args, { check = true } = {}) {
          const r = spawnSync(cmd, args, { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] });
          if (check && r.status !== 0) throw new Error(`${cmd} ${args.join(" ")} failed (${r.error ?? `exit ${r.status}`})`);
          return { status: r.status, stdout: (r.stdout ?? "").trim() };
        }

        function passwd(name) {
          const [, , uid, gid, , home] = run("getent", ["passwd", name]).stdout.split(":");
          return { uid: Number(uid), gid: Number(gid), home };
        }

        if (process.getuid() !== 0) throw new Error("must run as root");
        // Sandboxed steps run through run0 (systemd 256 or later): ubuntu-26.04 and
        // RHEL 10 have it, ubuntu-24.04 (systemd 255) does not.
        if (run("sh", ["-c", "command -v run0"], { check: false }).status !== 0) {
          throw new Error("run0 not found: sandboxed steps need systemd 256 or later (e.g. runs-on: ubuntu-26.04)");
        }
        const runner = process.env.SUDO_USER;
        if (!runner || runner === "root") throw new Error("must be started with sudo by the runner user");
        const user = CONFIG.user;
        if (user === runner || user === "root") throw new Error(`the sandbox user can't be ${user}: it must be another user than the runner and root`);

        // A runner that ran a job before would hand this one the previous job's
        // sandbox and workspace: refuse it. (The user itself may come with the
        // image, as on the devspace runners.)
        if (fs.existsSync(path.dirname(WORKDIR))) {
          throw new Error(`${path.dirname(WORKDIR)} already exists: the sandbox needs a fresh, ephemeral runner`);
        }
        if (run("getent", ["passwd", user], { check: false }).status !== 0) {
          run("useradd", ["--create-home", "--user-group", "--shell", "/bin/bash", user]);
        }
        const sandbox = passwd(user);
        const runnerHome = passwd(runner).home;
        // Also by uid: another name for root or the runner is still them.
        if (sandbox.uid === 0 || sandbox.uid === passwd(runner).uid) {
          throw new Error(`the sandbox user ${user} has uid ${sandbox.uid}, root's or the runner's`);
        }

        fs.mkdirSync(CONFIG_DIR, { recursive: true, mode: 0o755 });
        // The sandbox works on its own copy of what the job hands it (the files git
        // tracks, by default); the runner's home, which holds the runner's
        // credentials and the job's temp files, is closed.
        const HANDOFF = `${CONFIG_DIR}/handoff.cjs`;
        fs.writeFileSync(HANDOFF, process.env.RUNNER_SANDBOX_HANDOFF_JS ?? "", { mode: 0o644 });
        const { handoff } = require(HANDOFF);
        const copied = handoff({
          workspace: CONFIG.workspace,
          dest: WORKDIR,
          mode: CONFIG.handoff.workspace,
          include: CONFIG.handoff.include,
          owner: sandbox,
          // As runner, whose checkout it is: git as root would read the runner's
          // repository configuration.
          listTracked: () => {
            const r = spawnSync("runuser", ["-u", runner, "--", "git", "-C", CONFIG.workspace, "ls-files", "-z", "-s"], { encoding: "utf8", maxBuffer: 1 << 30 });
            if (r.status !== 0) throw new Error(`handoff.workspace = 'tracked needs a git checkout in ${CONFIG.workspace} (use 'all or 'none otherwise): ${(r.stderr ?? "").trim()}`);
            return r.stdout;
          },
        });
        console.log(`Handed ${copied} workspace entries (${CONFIG.handoff.workspace}) to ${user} in ${WORKDIR}`);
        fs.chmodSync(runnerHome, 0o700);
        for (const d of [TEMPDIR, TOOLCACHE]) {
          fs.mkdirSync(d, { mode: 0o755 });
          fs.chownSync(d, sandbox.uid, sandbox.gid);
        }

        fs.writeFileSync(`${CONFIG_DIR}/config.json`, JSON.stringify({ user, ...sandbox, workdir: WORKDIR, tempdir: TEMPDIR, toolcache: TOOLCACHE, runnerHome }), { mode: 0o644 });
        // runner-sandbox-run runs as root under this node, through the one sudo
        // rule runner keeps, so the binary and every directory above it must be
        // root's alone: a runner-owned node, as in a tool cache, would give runner
        // root.
        const node = fs.realpathSync(process.execPath);
        for (let p = node; ; p = path.dirname(p)) {
          const st = fs.statSync(p);
          if (st.uid !== 0 || st.mode & 0o002 || (st.mode & 0o020 && st.gid !== 0)) {
            throw new Error(`${p} must be owned by root and writable only by root: the step wrapper runs as root under ${node}`);
          }
          if (p === "/") break;
        }
        fs.mkdirSync("/usr/local/libexec", { recursive: true });
        for (const [dest, text, shebang] of [
          [EXEC, process.env.RUNNER_SANDBOX_EXEC_JS, true],
          [RUN, process.env.RUNNER_SANDBOX_RUN_JS, true],
          [LAUNCHER, process.env.RUNNER_SANDBOX_LAUNCH_JS, true],
          [FILECMD, process.env.RUNNER_SANDBOX_FILECMD_JS, false],
        ]) {
          if (!text) throw new Error(`nothing to install at ${dest}`);
          fs.writeFileSync(dest, shebang ? `#!${node}\n${text}` : text, { mode: 0o755 });
          fs.chmodSync(dest, shebang ? 0o755 : 0o644);
        }
        for (const d of ["/run/runner-sandbox/steps", "/run/runner-sandbox/results", "/run/runner-sandbox/staged"]) {
          fs.mkdirSync(d, { recursive: true, mode: 0o755 });
        }

        // Nothing may start the sandbox user's processes outside a step, where the
        // wrapper can't stop them: no cron, no at, no lingering user manager (whose
        // polkit action, like every other, is denied to it below).
        for (const deny of ["/etc/cron.deny", "/etc/at.deny"]) {
          const lines = fs.existsSync(deny) ? fs.readFileSync(deny, "utf8").split("\n") : [];
          if (!lines.includes(user)) fs.appendFileSync(deny, `${user}\n`, { mode: 0o600 });
        }
        run("loginctl", ["disable-linger", user]);
        if (fs.existsSync("/etc/polkit-1")) {
          fs.mkdirSync("/etc/polkit-1/rules.d", { recursive: true, mode: 0o755 });
          fs.writeFileSync("/etc/polkit-1/rules.d/00-runner-sandbox.rules", `polkit.addRule(function(action, subject) {
          if (subject.user == ${JSON.stringify(user)}) return polkit.Result.NO;
        });
        `, { mode: 0o644 });
        }

        // The last matching sudoers rule wins, and this file is read last.
        let sudoers = `${user} ALL=(ALL:ALL) !ALL\n`;
        if (CONFIG.lockRunnerSudo) {
          sudoers += `${runner} ALL=(ALL:ALL) !ALL\n${runner} ALL=(root) NOPASSWD: ${RUN} ""\n`;
        }
        fs.writeFileSync(`${SUDOERS}.tmp`, sudoers, { mode: 0o440 });
        run("visudo", ["-cq", "-f", `${SUDOERS}.tmp`]);
        fs.renameSync(`${SUDOERS}.tmp`, SUDOERS);

        if (CONFIG.lockRunnerSudo) {
          // The runner user is in the docker group, and processes the runner
          // already started keep that group; a daemon that isn't running can't
          // be asked for a root container.
          const present = DOCKER_UNITS.filter((u) => run("systemctl", ["cat", u], { check: false }).status === 0);
          if (present.length) run("systemctl", ["stop", ...present]);
          // Fail closed: the runner must have lost root, and kept only the wrapper.
          if (run("runuser", ["-u", runner, "--", "sudo", "-n", "true"], { check: false }).status === 0) {
            throw new Error(`${runner} still has sudo after the lock`);
          }
          run("runuser", ["-u", runner, "--", "sudo", "-n", "-l", RUN]);
        }
        console.log(`Entered the sandbox: later run steps execute as ${user} (uid ${sandbox.uid}) in ${WORKDIR}`);
        console.log(run("sudo", ["-l", "-U", runner]).stdout);
      shell: sudo --preserve-env=RUNNER_SANDBOX_EXEC_JS,RUNNER_SANDBOX_RUN_JS,RUNNER_SANDBOX_HANDOFF_JS,RUNNER_SANDBOX_FILECMD_JS,RUNNER_SANDBOX_LAUNCH_JS node {0}
    - id: build
      run: echo "v=1" >>"$GITHUB_OUTPUT"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - env: {}
      id: greet__say
      if: (success()) && (success())
      name: Run wfc-test/composite-ok@0000000000000000000000000000000000000000 step 1 (sandboxed)
      run: echo "message=${{ ('hello') }}, ${{ (steps.build.outputs.v) }}" >> "$GITHUB_OUTPUT"
      shell: /usr/local/bin/runner-sandbox-exec --action-path wfc-test/composite-ok@0000000000000000000000000000000000000000 {0}
    - env:
        RUNNER_SANDBOX_ENV_NAMES: MESSAGE
        RUNNER_SANDBOX_VAR_0: ${{ steps.greet__say.outputs.message }}
      id: greet__1
      if: (success()) && (steps.greet__say.outcome == 'success' && runner.os == 'Linux') && steps.greet__say.outcome != 'failure'
      name: Run wfc-test/composite-ok@0000000000000000000000000000000000000000 step 2 (sandboxed)
      run: |
        echo "${{ steps.greet__say.outputs.message }}" done
        echo '${{ ('costs $5, or $$1') }}' in "${{ '/var/lib/runner-sandbox/temp' }}" for ${{ github.repository }}
        echo "${{ ('/var/lib/runner-sandbox/work') }} ${{ ('/opt/runner-sandbox/actions/wfc-test/composite-ok/0000000000000000000000000000000000000000') }} ${{ ('1') }} ${{ ('.version') }}"
      shell: /usr/local/bin/runner-sandbox-exec --action-path wfc-test/composite-ok@0000000000000000000000000000000000000000 {0}
    - env:
        RUNNER_SANDBOX_ENV_NAMES: OUTCOME_0,OUTCOME_1,OUTPUT_0
        RUNNER_SANDBOX_VAR_0: ${{ steps.greet__say.outcome }}
        RUNNER_SANDBOX_VAR_1: ${{ steps.greet__1.outcome }}
        RUNNER_SANDBOX_VAR_2: ${{ steps.greet__say.outputs.message }}
      id: greet
      if: '!cancelled() && (success())'
      name: Finish wfc-test/composite-ok@0000000000000000000000000000000000000000 (generated)
      run: |-
        test "$OUTCOME_0" != failure
        test "$OUTCOME_1" != failure
        delim=ghadelimiter_$(cat /proc/sys/kernel/random/uuid)
        printf '%s<<%s\n%s\n%s\n' message "$delim" "$OUTPUT_0" "$delim" >>"$GITHUB_OUTPUT"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - env: {}
      id: again__say
      if: (success()) && (success())
      name: Run wfc-test/composite-ok@0000000000000000000000000000000000000000 step 1 (sandboxed)
      run: echo "message=${{ ('hello') }}, ${{ ('world $1') }}" >> "$GITHUB_OUTPUT"
      shell: /usr/local/bin/runner-sandbox-exec --action-path wfc-test/composite-ok@0000000000000000000000000000000000000000 {0}
    - env:
        RUNNER_SANDBOX_ENV_NAMES: MESSAGE
        RUNNER_SANDBOX_VAR_0: ${{ steps.again__say.outputs.message }}
      id: again__1
      if: (success()) && (steps.again__say.outcome == 'success' && runner.os == 'Linux') && steps.again__say.outcome != 'failure'
      name: Run wfc-test/composite-ok@0000000000000000000000000000000000000000 step 2 (sandboxed)
      run: |
        echo "${{ steps.again__say.outputs.message }}" done
        echo '${{ ('costs $5, or $$1') }}' in "${{ '/var/lib/runner-sandbox/temp' }}" for ${{ github.repository }}
        echo "${{ ('/var/lib/runner-sandbox/work') }} ${{ ('/opt/runner-sandbox/actions/wfc-test/composite-ok/0000000000000000000000000000000000000000') }} ${{ ('1') }} ${{ ('.version') }}"
      shell: /usr/local/bin/runner-sandbox-exec --action-path wfc-test/composite-ok@0000000000000000000000000000000000000000 {0}
    - env:
        RUNNER_SANDBOX_ENV_NAMES: OUTCOME_0,OUTCOME_1,OUTPUT_0
        RUNNER_SANDBOX_VAR_0: ${{ steps.again__say.outcome }}
        RUNNER_SANDBOX_VAR_1: ${{ steps.again__1.outcome }}
        RUNNER_SANDBOX_VAR_2: ${{ steps.again__say.outputs.message }}
      id: again
      if: '!cancelled() && (success())'
      name: Finish wfc-test/composite-ok@0000000000000000000000000000000000000000 (generated)
      run: |-
        test "$OUTCOME_0" != failure
        test "$OUTCOME_1" != failure
        delim=ghadelimiter_$(cat /proc/sys/kernel/random/uuid)
        printf '%s<<%s\n%s\n%s\n' message "$delim" "$OUTPUT_0" "$delim" >>"$GITHUB_OUTPUT"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - env:
        M: ${{ steps.greet.outputs.message }}
        RUNNER_SANDBOX_ENV: M
      run: echo "$M"
      shell: /usr/local/bin/runner-sandbox-exec {0}
    - id: runner-sandbox-seal
      if: always()
      name: Seal the sandbox (generated)
      run: /usr/local/bin/runner-sandbox-exec --seal
      shell: bash
name: t
on:
  push: {}
